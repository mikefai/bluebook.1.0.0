    function MathRenderer({ content, className = '' }) {
      if (!content) return null;
      const ref = React.useRef(null);

      React.useEffect(() => {
        if (!ref.current) return;
        ref.current.textContent = content;
        if (window.renderMathInElement) {
          try {
            window.renderMathInElement(ref.current, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false },
                { left: '\\[', right: '\\]', display: true },
                { left: '\\(', right: '\\)', display: false }
              ],
              throwOnError: false,
              errorColor: '#f43f5e'
            });
          } catch (e) {
            console.warn('KaTeX render error:', e);
          }
        }
      }, [content]);

      return (
        <span ref={ref} className={`math-rendered-content ${className}`} />
      );
    }

    // Safe phrase-based text highlighter that preserves React virtual DOM
    function renderPassageWithHighlights(text, phrases = []) {
      if (!text) return '';
      if (!phrases || phrases.length === 0) return text;

      let segments = [text];
      phrases.forEach((phrase, phraseIdx) => {
        if (!phrase || phrase.trim().length === 0) return;
        const nextSegments = [];
        segments.forEach((seg, segIdx) => {
          if (typeof seg !== 'string') {
            nextSegments.push(seg);
            return;
          }
          const lowerSeg = seg.toLowerCase();
          const lowerPhrase = phrase.toLowerCase();
          let startIdx = 0;
          let matchIdx = lowerSeg.indexOf(lowerPhrase, startIdx);

          if (matchIdx === -1) {
            nextSegments.push(seg);
            return;
          }

          while (matchIdx !== -1) {
            if (matchIdx > startIdx) {
              nextSegments.push(seg.slice(startIdx, matchIdx));
            }
            const matchedText = seg.slice(matchIdx, matchIdx + phrase.length);
            nextSegments.push(
              <mark key={`hl-${phraseIdx}-${segIdx}-${matchIdx}`} className="user-highlight">
                {matchedText}
              </mark>
            );
            startIdx = matchIdx + phrase.length;
            matchIdx = lowerSeg.indexOf(lowerPhrase, startIdx);
          }
          if (startIdx < seg.length) {
            nextSegments.push(seg.slice(startIdx));
          }
        });
        segments = nextSegments;
      });

      return segments;
    }

    // 10. EVALUATOR & SCORING ENGINES

    /**
     * Evaluates Student-Produced Response grid-ins against correct answers.
     * Pure JS supporting fractions, decimals, unsimplified forms, negative numbers,
     * and repeating decimal rounding/truncation.
     */
    function evaluateGridIn(rawUserAnswer, correctAnswer, tolerance = 1e-5) {
      if (rawUserAnswer === undefined || rawUserAnswer === null) {
        return { isCorrect: false, normalizedUser: null, message: "Empty response" };
      }

      const userStr = String(rawUserAnswer).trim();
      if (userStr === "") {
        return { isCorrect: false, normalizedUser: null, message: "Empty response" };
      }

      // Reject invalid characters
      if (!/^-?[0-9.\/]+$/.test(userStr)) {
        return { isCorrect: false, normalizedUser: null, message: "Invalid characters in input" };
      }

      // Reject multiple negative signs or negative sign not at index 0
      if ((userStr.match(/-/g) || []).length > 1 || (userStr.includes("-") && !userStr.startsWith("-"))) {
        return { isCorrect: false, normalizedUser: null, message: "Invalid negative sign placement" };
      }

      // Reject multiple fraction slashes
      if ((userStr.match(/\//g) || []).length > 1) {
        return { isCorrect: false, normalizedUser: null, message: "Multiple fraction slashes not allowed" };
      }

      // Reject decimals inside fractions per SAT rules (e.g. "1.5/2", "3/1.5")
      if (userStr.includes('/') && userStr.includes('.')) {
        return { isCorrect: false, normalizedUser: null, message: "Decimals in fractions not permitted per SAT rules" };
      }

      // Reject multiple decimal points in numerator or denominator
      const parts = userStr.split("/");
      for (const part of parts) {
        if ((part.match(/\./g) || []).length > 1) {
          return { isCorrect: false, normalizedUser: null, message: "Multiple decimal points in number" };
        }
      }

      // Parse numerical value
      let userVal;
      if (userStr.includes("/")) {
        const [numStr, denStr] = userStr.split("/");
        const num = parseFloat(numStr);
        const den = parseFloat(denStr);
        if (isNaN(num) || isNaN(den) || den === 0) {
          return { isCorrect: false, normalizedUser: null, message: "Division by zero or invalid fraction" };
        }
        userVal = num / den;
      } else {
        userVal = parseFloat(userStr);
        if (isNaN(userVal)) {
          return { isCorrect: false, normalizedUser: null, message: "Unable to parse numeric value" };
        }
      }

      const targets = Array.isArray(correctAnswer) ? correctAnswer : [correctAnswer];

      for (const target of targets) {
        const targetStr = String(target).trim();

        // 1. Exact string match
        if (userStr.toLowerCase() === targetStr.toLowerCase()) {
          return { isCorrect: true, normalizedUser: userVal, message: "Exact match" };
        }

        // 2. Parse target numeric value
        let targetVal;
        if (targetStr.includes("/")) {
          const [tNum, tDen] = targetStr.split("/");
          targetVal = parseFloat(tNum) / parseFloat(tDen);
        } else {
          targetVal = parseFloat(targetStr);
        }

        if (isNaN(targetVal)) continue;

        // Floating point equivalence within tolerance
        if (Math.abs(userVal - targetVal) <= tolerance) {
          return { isCorrect: true, normalizedUser: userVal, message: "Numerical equivalence match" };
        }

        // Repeating decimal truncation/rounding check
        if (targetStr.includes("/") && !Number.isInteger(targetVal)) {
          const isPositive = targetVal >= 0;
          const absVal = Math.abs(targetVal);
          const strVal = absVal.toString();
          const dotIndex = strVal.indexOf(".");
          if (dotIndex !== -1) {
            const decPart = strVal.slice(dotIndex + 1);
            const trunc3 = (isPositive ? "" : "-") + "0." + decPart.slice(0, 3);
            const trunc4 = (isPositive ? "" : "-") + "0." + decPart.slice(0, 4);
            const round3Val = (Math.round(targetVal * 1000) / 1000).toString();
            const round4Val = (Math.round(targetVal * 10000) / 10000).toString();

            const cleanUser = userStr.startsWith(".") ? "0" + userStr : userStr.startsWith("-.") ? "-0." + userStr.slice(2) : userStr;
            if ([trunc3, trunc4, round3Val, round4Val].includes(cleanUser)) {
              return { isCorrect: true, normalizedUser: userVal, message: "Repeating decimal rounding match" };
            }
          }
        }
      }

      return { isCorrect: false, normalizedUser: userVal, message: "Value does not match expected answer" };
    }

    /**
     * Calculates scaled section score (200 - 800) using official adaptive routing:
     * Reading & Writing: threshold = 18 correct in M1 -> Hard M2.
     * Math: threshold = 15 correct in M1 -> Hard M2.
     * Easy Module 2 is capped at <= 590.
     * Hard Module 2 ranges from 450/480 to 800.
     * Quantized to multiples of 10.
     */
    function calculateScaledScore(m1Raw, m2Raw, section) {
      const s = String(section || '').toLowerCase().trim();
      const isRW = s === 'reading-writing' || s === 'rw' || s === 'reading_writing' || s === 'reading' || s === 'reading & writing';
      const m1Max = isRW ? 27 : 22;
      const m2Max = isRW ? 27 : 22;
      const totalMax = m1Max + m2Max;
      const threshold = isRW ? 18 : 15;

      const rawTotal = m1Raw + m2Raw;
      const tier = m1Raw >= threshold ? 'hard' : 'easy';

      let scaledScore = 200;

      if (tier === 'hard') {
        const baseline = 480;
        const remainingRaw = Math.max(0, rawTotal - threshold);
        const maxRemaining = totalMax - threshold;
        const fraction = remainingRaw / maxRemaining;

        scaledScore = Math.round(baseline + fraction * 320);
        scaledScore = Math.round(scaledScore / 10) * 10;
        scaledScore = Math.min(800, Math.max(480, scaledScore));
      } else {
        const fraction = rawTotal / (threshold - 1 + m2Max);
        scaledScore = Math.round(200 + fraction * 390);
        scaledScore = Math.round(scaledScore / 10) * 10;
        scaledScore = Math.min(590, Math.max(200, scaledScore));
      }

      return { scaledScore, tier, rawTotal, maxRaw: totalMax };
    }

    function calculateCompositeScore(rwScaled, mathScaled) {
      return {
        composite: rwScaled + mathScaled,
        readingWriting: rwScaled,
        math: mathScaled
      };
    }

    const STORAGE_KEY = "DIGITAL_SAT_APP_STATE_V1";

    const DEFAULT_APP_STATE = {
      version: 1,
      lastUpdated: new Date().toISOString(),
      settings: {
        theme: "dark",
        timerVisible: true,
        timerMode: "countdown",
        calculatorOpen: false,
        calculatorType: "graphing",
        highlighterColor: "yellow",
        fontSize: "normal",
        soundEffects: true
      },
      activeExam: null,
      examHistory: [],
      drillHistory: [],
      customNotes: {},
      bookmarkedQuestions: []
    };

    function useSatStorage() {
      const [state, setState] = React.useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.version === 1) {
              return { ...DEFAULT_APP_STATE, ...parsed };
            }
          }
        } catch (e) {
          console.warn("Error loading state from localStorage:", e);
        }
        return DEFAULT_APP_STATE;
      });

      // Synchronize theme to document root
      React.useEffect(() => {
        const root = document.documentElement;
        if (state.settings.theme === "dark") {
          root.classList.add("dark");
        } else {
          root.classList.remove("dark");
        }
      }, [state.settings.theme]);

      // Save to localStorage on change
      React.useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          console.warn("Failed saving state to localStorage:", e);
        }
      }, [state]);

      const toggleTheme = () => {
        setState(prev => ({
          ...prev,
          settings: {
            ...prev.settings,
            theme: prev.settings.theme === "dark" ? "light" : "dark"
          }
        }));
      };

      const saveExamAttempt = (record) => {
        setState(prev => ({
          ...prev,
          examHistory: [record, ...prev.examHistory],
          activeExam: null
        }));
      };

      const recordDrillResult = (drillResult) => {
        setState(prev => ({
          ...prev,
          drillHistory: [drillResult, ...prev.drillHistory]
        }));
      };

      const exportStateJson = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
        const downloadAnchor = document.createElement("a");
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `digital-sat-prep-export-${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importStateJson = (jsonString) => {
        try {
          if (typeof jsonString !== "string" || !jsonString.trim()) {
            return { success: false, message: "Invalid payload: Input must be a non-empty string." };
          }
          // Guard against oversize payload (>5MB)
          const MAX_SIZE_BYTES = 5 * 1024 * 1024; // 5MB
          if (jsonString.length > MAX_SIZE_BYTES) {
            return { success: false, message: "Payload size exceeds maximum allowed limit (5MB)." };
          }

          const parsed = JSON.parse(jsonString);
          if (!parsed || typeof parsed !== "object" || parsed.version !== 1 || !parsed.settings || !Array.isArray(parsed.examHistory)) {
            return { success: false, message: "Invalid backup file schema." };
          }

          // Validate examHistory item structure
          const isValidExamHistory = parsed.examHistory.every(item =>
            item &&
            typeof item === "object" &&
            typeof item.id === "string" &&
            (typeof item.examId === "number" || typeof item.examId === "string") &&
            item.scores &&
            typeof item.scores === "object"
          );

          if (!isValidExamHistory) {
            return { success: false, message: "Invalid backup file: examHistory records are malformed." };
          }

          setState(prev => ({ ...prev, ...parsed }));
          return { success: true, message: "Data successfully restored!" };
        } catch (e) {
          return { success: false, message: "Error parsing JSON file." };
        }
      };

      const resetAllData = () => {
        setState({
          ...DEFAULT_APP_STATE,
          settings: { ...DEFAULT_APP_STATE.settings, theme: state.settings.theme }
        });
      };

      return {
        state,
        setState,
        toggleTheme,
        saveExamAttempt,
        recordDrillResult,
        exportStateJson,
        importStateJson,
        resetAllData
      };
    }

    // Calculator Modal (Desmos + Canvas Scientific Fallback)
    function DesmosCalculatorModal({ isOpen, onClose }) {
      const containerRef = React.useRef(null);
      const canvasRef = React.useRef(null);
      const [desmosLoaded, setDesmosLoaded] = React.useState(false);
      const [calcExpr, setCalcExpr] = React.useState("");
      const [calcResult, setCalcResult] = React.useState("");
      const [plotFn, setPlotFn] = React.useState("x^2 - 4");

      // Initialize Desmos if available
      React.useEffect(() => {
        if (!isOpen) return;

        if (window.Desmos && containerRef.current) {
          try {
            containerRef.current.innerHTML = "";
            const calculator = window.Desmos.GraphingCalculator(containerRef.current, {
              keypad: true,
              expressions: true,
              settingsMenu: false,
              zoomButtons: true
            });
            calculator.setExpression({ id: 'graph1', latex: 'y=x^2-2' });
            setDesmosLoaded(true);
            return () => calculator.destroy();
          } catch (e) {
            console.warn("Desmos init error, using canvas fallback:", e);
            setDesmosLoaded(false);
          }
        } else {
          setDesmosLoaded(false);
        }
      }, [isOpen]);

      // Draw function on HTML5 canvas fallback
      React.useEffect(() => {
        if (desmosLoaded || !isOpen || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);

        // Gridlines & Axes
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;

        // Draw axes
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.moveTo(w / 2, 0);
        ctx.lineTo(w / 2, h);
        ctx.stroke();

        // Plot function y = f(x)
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 2.5;
        ctx.beginPath();

        const scaleX = 25; // 25px per unit
        const scaleY = 25;
        let isFirst = true;

        let compiledFn = null;
        try {
          // Safe evaluation of standard functions
          const safeExpr = plotFn
            .replace(/\^/g, '**')
            .replace(/sin/g, 'Math.sin')
            .replace(/cos/g, 'Math.cos')
            .replace(/tan/g, 'Math.tan')
            .replace(/sqrt/g, 'Math.sqrt')
            .replace(/log/g, 'Math.log10')
            .replace(/ln/g, 'Math.log')
            .replace(/pi/g, 'Math.PI')
            .replace(/e/g, 'Math.E');
          compiledFn = Function('x', `"use strict"; return (${safeExpr});`);
        } catch (e) {
          compiledFn = null;
        }

        for (let px = 0; px < w; px++) {
          const x = (px - w / 2) / scaleX;
          let y = 0;
          if (compiledFn) {
            try {
              const res = compiledFn(x);
              y = typeof res === 'number' && !isNaN(res) ? res : 0;
            } catch (err) {
              y = 0;
            }
          }

          const py = h / 2 - y * scaleY;
          if (py >= -100 && py <= h + 100) {
            if (isFirst) {
              ctx.moveTo(px, py);
              isFirst = false;
            } else {
              ctx.lineTo(px, py);
            }
          } else {
            isFirst = true;
          }
        }
        ctx.stroke();
      }, [desmosLoaded, isOpen, plotFn]);

      if (!isOpen) return null;

      const handleBtnClick = (val) => {
        if (val === 'AC') {
          setCalcExpr("");
          setCalcResult("");
        } else if (val === 'DEL') {
          setCalcExpr(prev => prev.slice(0, -1));
        } else if (val === '=') {
          try {
            const sanitized = calcExpr
              .replace(/\^/g, '**')
              .replace(/sin/g, 'Math.sin')
              .replace(/cos/g, 'Math.cos')
              .replace(/tan/g, 'Math.tan')
              .replace(/sqrt/g, 'Math.sqrt')
              .replace(/pi/g, 'Math.PI')
              .replace(/e/g, 'Math.E');
            const res = Function(`"use strict"; return (${sanitized})`)();
            setCalcResult(String(Math.round(res * 100000) / 100000));
          } catch (e) {
            setCalcResult("Error");
          }
        } else {
          setCalcExpr(prev => prev + val);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-3">
          <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl max-w-4xl w-full h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div className="flex items-center justify-between px-5 py-3 border-b border-slate-200 dark:border-zinc-800 bg-slate-100 dark:bg-zinc-950">
              <div className="flex items-center space-x-2">
                <Icon name="Calculator" className="w-5 h-5 text-indigo-600 dark:text-indigo-400" />
                <span className="font-bold text-slate-800 dark:text-zinc-100">
                  {desmosLoaded ? "Desmos Graphing Calculator" : "Built-in Scientific & Canvas Graphing Calculator"}
                </span>
              </div>
              <button onClick={onClose} className="p-1.5 hover:bg-slate-200 dark:hover:bg-zinc-800 rounded-lg text-slate-500">
                <Icon name="X" className="w-5 h-5" />
              </button>
            </div>

            <div className="flex-1 overflow-hidden relative">
              {/* Desmos Container */}
              <div ref={containerRef} className={`w-full h-full ${desmosLoaded ? 'block' : 'hidden'}`}></div>

              {/* Offline Canvas Grapher & Scientific Pad Fallback */}
              {!desmosLoaded && (
                <div className="w-full h-full flex flex-col md:flex-row">
                  {/* Left: Canvas Grapher */}
                  <div className="flex-1 bg-slate-900 flex flex-col items-center justify-center p-4">
                    <div className="w-full max-w-md mb-2 flex items-center space-x-2">
                      <span className="text-white text-sm font-mono">y =</span>
                      <input
                        type="text"
                        value={plotFn}
                        onChange={(e) => setPlotFn(e.target.value)}
                        placeholder="e.g. x^2 - 4"
                        className="flex-1 px-3 py-1.5 bg-zinc-800 border border-zinc-700 text-white rounded-lg font-mono text-sm"
                      />
                    </div>
                    <canvas ref={canvasRef} width={420} height={320} className="bg-zinc-950 rounded-xl border border-zinc-800 shadow" />
                  </div>

                  {/* Right: Scientific Keypad */}
                  <div className="w-full md:w-80 bg-slate-50 dark:bg-zinc-900 border-t md:border-t-0 md:border-l border-slate-200 dark:border-zinc-800 p-4 flex flex-col">
                    <div className="bg-white dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 p-3 rounded-xl mb-3 text-right">
                      <div className="text-xs text-slate-400 font-mono h-4 overflow-x-auto">{calcExpr || "0"}</div>
                      <div className="text-xl font-bold font-mono text-slate-900 dark:text-white truncate">{calcResult || "0"}</div>
                    </div>

                    <div className="grid grid-cols-4 gap-1.5 text-xs font-mono">
                      {['sin', 'cos', 'tan', 'sqrt', '(', ')', '^', '/', '7', '8', '9', '*', '4', '5', '6', '-', '1', '2', '3', '+', '0', '.', 'pi', '='].map(btn => (
                        <button
                          key={btn}
                          onClick={() => handleBtnClick(btn)}
                          className={`p-2.5 rounded-lg font-bold transition ${btn === '=' ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-slate-200 dark:bg-zinc-800 text-slate-800 dark:text-zinc-200 hover:bg-slate-300 dark:hover:bg-zinc-700'}`}
                        >
                          {btn}
                        </button>
                      ))}
                      <button onClick={() => handleBtnClick('AC')} className="col-span-2 p-2 rounded-lg bg-rose-500/20 text-rose-600 dark:text-rose-400 font-bold hover:bg-rose-500/30">
                        AC
                      </button>
                      <button onClick={() => handleBtnClick('DEL')} className="col-span-2 p-2 rounded-lg bg-amber-500/20 text-amber-600 dark:text-amber-400 font-bold hover:bg-amber-500/30">
                        DEL
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

              <Icon name="Pause" className="w-8 h-8" />
            </div>
            <div className="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 text-xs font-bold mb-3">
              <span>☕ Take a Breather</span>
            </div>
            <h3 className="text-2xl font-bold text-slate-900 dark:text-white mb-2">Test Paused — Take a Breath</h3>
            <p className="text-sm text-slate-600 dark:text-zinc-400 mb-6 leading-relaxed">
              Your test timer and question progress are safely frozen. Take a few deep breaths, roll your shoulders, and clear your mind. Resume whenever you feel centered and ready.
            </p>
            <button
              onClick={onResume}
              className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold shadow-md transition"
            >
              Resume Testing
            </button>
          </div>
        </div>
      );
    }

    // 10-Minute Section Break Screen
    function SectionBreakScreen({ onResume }) {
      const [breakSeconds, setBreakSeconds] = React.useState(600); // 10 minutes

      React.useEffect(() => {
        const interval = setInterval(() => {
          setBreakSeconds(prev => (prev > 0 ? prev - 1 : 0));
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      const mins = Math.floor(breakSeconds / 60);
      const secs = breakSeconds % 60;
      const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      return (
        <div className="min-h-[80vh] flex items-center justify-center p-6">
          <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl max-w-lg w-full p-8 text-center shadow-2xl">
            <div className="w-16 h-16 bg-emerald-500/10 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4">
              <Icon name="Clock" className="w-8 h-8" />
            </div>
            <div className="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 text-xs font-bold mb-3">
              <span>🌟 Halfway There!</span>
            </div>
            <h2 className="text-2xl font-bold text-slate-900 dark:text-white mb-2">Section 1 Complete — Great Focus!</h2>
            <p className="text-sm text-slate-600 dark:text-zinc-400 mb-4 leading-relaxed">
              You powered through 54 Reading & Writing questions. Official Digital SAT policy provides an optional 10-minute break (10:00). Stand up, stretch your arms, drink some water, and reset your mind for Math!
            </p>
            <div className="my-6 p-4 bg-slate-100 dark:bg-zinc-800 rounded-xl">
              <div className="text-4xl font-mono font-bold text-slate-900 dark:text-white">{formatted}</div>
              <div className="text-xs text-slate-500 dark:text-zinc-400 mt-1">Break Time Remaining</div>
            </div>
            <button
              onClick={onResume}
              className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold shadow transition"
            >
              Resume Testing Now (Start Math Module 1)
            </button>
          </div>
        </div>
      );
    }
    // ==========================================
    // 13. BLUEBOOK PROCTORED TESTING SHELL
    // ==========================================
    function ExamProctoredShell({ examId, onExitExam, onFinishExam }) {
      const scaffold = React.useMemo(() => new ExamScaffoldEngine(examId * 9999 + 1337), [examId]);
      const examQuestions = React.useMemo(() => scaffold.generateExam(examId), [examId, scaffold]);

      // Testing Stages: 'rw-m1' | 'rw-m2' | 'break' | 'math-m1' | 'math-m2'
      const [stage, setStage] = React.useState('rw-m1');
      const [currentQIndex, setCurrentQIndex] = React.useState(0);
      const [answers, setAnswers] = React.useState({});
      const [bookmarks, setBookmarks] = React.useState({});
      const [eliminations, setEliminations] = React.useState({}); // { [qId]: { 'A': true } }
      const [highlights, setHighlights] = React.useState({}); // { [qId]: ['phrase'] }
      const [timeSpent, setTimeSpent] = React.useState({}); // { [qId]: seconds }
      const [qEnterTime, setQEnterTime] = React.useState(Date.now());

      // Timing state: 32m for RW, 35m for Math
      const [timeRemaining, setTimeRemaining] = React.useState(32 * 60);
      const [isTimerHidden, setIsTimerHidden] = React.useState(false);
      const [isPaused, setIsPaused] = React.useState(false);
      const [show5MinAlert, setShow5MinAlert] = React.useState(false);

      // Modals
      const [isReviewOpen, setIsReviewOpen] = React.useState(false);
      const [isCalcOpen, setIsCalcOpen] = React.useState(false);
      const [isRefOpen, setIsRefOpen] = React.useState(false);
      const [fontSize, setFontSize] = React.useState(16); // 16px default

      // Adaptive Routing Tracking
      const [rwM1Raw, setRwM1Raw] = React.useState(null);
      const [mathM1Raw, setMathM1Raw] = React.useState(null);
      const [rwTier, setRwTier] = React.useState(null);
      const [mathTier, setMathTier] = React.useState(null);

      // Filter questions for active module
      const currentModuleQuestions = React.useMemo(() => {
        if (stage === 'rw-m1') {
          return examQuestions.filter(q => q.section === 'reading-writing' && q.module === 1);
        } else if (stage === 'rw-m2') {
          return examQuestions.filter(q => q.section === 'reading-writing' && q.module === 2);
        } else if (stage === 'math-m1') {
          return examQuestions.filter(q => q.section === 'math' && q.module === 1);
        } else if (stage === 'math-m2') {
          return examQuestions.filter(q => q.section === 'math' && q.module === 2);
        }
        return [];
      }, [stage, examQuestions]);

      const activeQ = currentModuleQuestions[currentQIndex] || currentModuleQuestions[0];

      // Track time spent on question transitions
      const recordTimeForActiveQ = React.useCallback(() => {
        if (!activeQ) return;
        const now = Date.now();
        const elapsed = Math.round((now - qEnterTime) / 1000);
        setTimeSpent(prev => ({
          ...prev,
          [activeQ.id]: (prev[activeQ.id] || 0) + elapsed
        }));
        setQEnterTime(now);
      }, [activeQ, qEnterTime]);

      // Timer interval
      React.useEffect(() => {
        if (isPaused || stage === 'break') return;

        const interval = setInterval(() => {
          setTimeRemaining(prev => {
            if (prev <= 1) {
              clearInterval(interval);
              handleModuleSubmit();
              return 0;
            }
            // 5-minute unhide trigger
            if (prev === 300) {
              setIsTimerHidden(false);
              setShow5MinAlert(true);
              setTimeout(() => setShow5MinAlert(false), 6000);
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(interval);
      }, [isPaused, stage]);

      // Module Transition Logic
      const handleModuleSubmit = () => {
        recordTimeForActiveQ();

        if (stage === 'rw-m1') {
          // Calculate RW M1 Score
          const m1Qs = examQuestions.filter(q => q.section === 'reading-writing' && q.module === 1);
          let correct = 0;
          m1Qs.forEach(q => {
            if (answers[q.id] === q.correctAnswer) correct++;
          });
          setRwM1Raw(correct);
          const tier = correct >= 18 ? 'hard' : 'easy';
          setRwTier(tier);

          // Move to RW M2
          setStage('rw-m2');
          setCurrentQIndex(0);
          setTimeRemaining(32 * 60);
          setQEnterTime(Date.now());
        } else if (stage === 'rw-m2') {
          // Move to 10-minute break
          setStage('break');
        } else if (stage === 'math-m1') {
          // Calculate Math M1 Score
          const m1MathQs = examQuestions.filter(q => q.section === 'math' && q.module === 1);
          let correct = 0;
          m1MathQs.forEach(q => {
            if (q.options) {
              if (answers[q.id] === q.correctAnswer) correct++;
            } else {
              if (evaluateGridIn(answers[q.id], q.correctAnswer).isCorrect) correct++;
            }
          });
          setMathM1Raw(correct);
          const tier = correct >= 15 ? 'hard' : 'easy';
          setMathTier(tier);

          // Move to Math M2
          setStage('math-m2');
          setCurrentQIndex(0);
          setTimeRemaining(35 * 60);
          setQEnterTime(Date.now());
        } else if (stage === 'math-m2') {
          // Complete Exam and calculate final diagnostic scores!
          finalizeExamAttempt();
        }
      };

      const finalizeExamAttempt = () => {
        recordTimeForActiveQ();

        // Count scores
        let rwM1Count = 0;
        let rwM2Count = 0;
        let mathM1Count = 0;
        let mathM2Count = 0;

        const domainStats = {};
        DOMAINS.forEach(d => {
          domainStats[d.id] = { totalQuestions: 0, correctQuestions: 0, accuracyPercentage: 0 };
        });

        const questionTypeStats = {};
        const rawResults = {};

        examQuestions.forEach(q => {
          const uAns = answers[q.id];
          let isCorr = false;
          if (q.options) {
            isCorr = (uAns === q.correctAnswer);
          } else {
            isCorr = evaluateGridIn(uAns, q.correctAnswer).isCorrect;
          }
          rawResults[q.id] = isCorr;

          if (q.section === 'reading-writing') {
            if (q.module === 1 && isCorr) rwM1Count++;
            if (q.module === 2 && isCorr) rwM2Count++;
          } else {
            if (q.module === 1 && isCorr) mathM1Count++;
            if (q.module === 2 && isCorr) mathM2Count++;
          }

          // Domain aggregation
          if (domainStats[q.domain]) {
            domainStats[q.domain].totalQuestions++;
            if (isCorr) domainStats[q.domain].correctQuestions++;
          }

          // Question type aggregation
          if (!questionTypeStats[q.questionType]) {
            questionTypeStats[q.questionType] = { totalQuestions: 0, correctQuestions: 0, accuracyPercentage: 0 };
          }
          questionTypeStats[q.questionType].totalQuestions++;
          if (isCorr) questionTypeStats[q.questionType].correctQuestions++;
        });

        // Compute domain percentages
        Object.keys(domainStats).forEach(domId => {
          const st = domainStats[domId];
          st.accuracyPercentage = st.totalQuestions > 0 ? Math.round((st.correctQuestions / st.totalQuestions) * 100) : 0;
        });

        // Compute question type percentages
        Object.keys(questionTypeStats).forEach(qtId => {
          const qt = questionTypeStats[qtId];
          qt.accuracyPercentage = qt.totalQuestions > 0 ? Math.round((qt.correctQuestions / qt.totalQuestions) * 100) : 0;
        });

        // Scaled Scores
        const rwScoreObj = calculateScaledScore(rwM1Count, rwM2Count, 'reading-writing');
        const mathScoreObj = calculateScaledScore(mathM1Count, mathM2Count, 'math');
        const compositeObj = calculateCompositeScore(rwScoreObj.scaledScore, mathScoreObj.scaledScore);

        // Pacing metrics
        const times = Object.values(timeSpent);
        const totalDuration = times.reduce((a, b) => a + b, 0);
        const avgSec = times.length > 0 ? Math.round(totalDuration / times.length) : 70;
        const rushed = times.filter(t => t < 30).length;
        const stalled = times.filter(t => t > 120).length;

        const attemptRecord = {
          id: `attempt-${Date.now()}`,
          examId,
          completedAt: new Date().toISOString(),
          totalDurationSeconds: totalDuration,
          scores: {
            composite: compositeObj.composite,
            readingWriting: rwScoreObj.scaledScore,
            math: mathScoreObj.scaledScore,
            rwM1Raw: rwM1Count,
            rwM2Raw: rwM2Count,
            rwTier: rwScoreObj.tier,
            mathM1Raw: mathM1Count,
            mathM2Raw: mathM2Count,
            mathTier: mathScoreObj.tier
          },
          domainStats,
          questionTypeStats,
          pacingSummary: {
            avgSecondsPerQuestion: avgSec,
            rushedQuestionCount: rushed,
            stalledQuestionCount: stalled,
            timeSpentPerQuestion: timeSpent
          },
          answers,
          rawQuestionResults: rawResults
        };

        onFinishExam(attemptRecord);
      };

      const handleNext = () => {
        recordTimeForActiveQ();
        if (currentQIndex < currentModuleQuestions.length - 1) {
          setCurrentQIndex(prev => prev + 1);
        } else {
          setIsReviewOpen(true);
        }
      };

      const handlePrev = () => {
        recordTimeForActiveQ();
        if (currentQIndex > 0) {
          setCurrentQIndex(prev => prev - 1);
        }
      };

      const handleAnswerSelect = (optLetter) => {
        if (!activeQ) return;
        setAnswers(prev => ({ ...prev, [activeQ.id]: optLetter }));
        // If this option was eliminated, un-eliminate it
        if (eliminations[activeQ.id] && eliminations[activeQ.id][optLetter]) {
          setEliminations(prev => ({
            ...prev,
            [activeQ.id]: { ...prev[activeQ.id], [optLetter]: false }
          }));
        }
      };

      const toggleEliminate = (e, optLetter) => {
        e.stopPropagation();
        if (!activeQ) return;
        setEliminations(prev => {
          const qElims = prev[activeQ.id] || {};
          return {
            ...prev,
            [activeQ.id]: {
              ...qElims,
              [optLetter]: !qElims[optLetter]
            }
          };
        });
        // If currently selected, clear selection
        if (answers[activeQ.id] === optLetter) {
          setAnswers(prev => ({ ...prev, [activeQ.id]: "" }));
        }
      };

      const toggleBookmark = () => {
        if (!activeQ) return;
        setBookmarks(prev => ({
          ...prev,
          [activeQ.id]: !prev[activeQ.id]
        }));
      };

      const handleJumpToQuestion = (idx) => {
        recordTimeForActiveQ();
        setCurrentQIndex(idx);
      };

      const handlePause = () => {
        recordTimeForActiveQ();
        setIsPaused(true);
      };

      const handleResume = () => {
        setQEnterTime(Date.now());
        setIsPaused(false);
      };

      // Bluebook Keyboard Shortcuts (A/B/C/D or 1/2/3/4, Arrows, Escape)
      React.useEffect(() => {
        const handleKeyDown = (e) => {
          if (isPaused || stage === 'break') return;

          const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
          const isInputFocused = activeTag === 'input' || activeTag === 'textarea';

          if (e.key === 'Escape') {
            if (isReviewOpen) setIsReviewOpen(false);
            if (isCalcOpen) setIsCalcOpen(false);
            if (isRefOpen) setIsRefOpen(false);
            return;
          }

          if (isInputFocused || isReviewOpen || isCalcOpen || isRefOpen) return;

          if (activeQ && activeQ.options) {
            const keyUpper = e.key.toUpperCase();
            if (['A', 'B', 'C', 'D'].includes(keyUpper)) {
              handleAnswerSelect(keyUpper);
              return;
            }
            if (['1', '2', '3', '4'].includes(e.key)) {
              const letterMap = { '1': 'A', '2': 'B', '3': 'C', '4': 'D' };
              handleAnswerSelect(letterMap[e.key]);
              return;
            }
          }

          if (e.key === 'ArrowRight') {
            e.preventDefault();
            handleNext();
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            handlePrev();
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [activeQ, currentQIndex, currentModuleQuestions, answers, isReviewOpen, isCalcOpen, isRefOpen, isPaused, stage, handleNext, handlePrev, handleAnswerSelect]);

      const handleAddHighlight = () => {
        if (!activeQ) return;
        const selected = window.getSelection().toString().trim();
        if (selected.length > 2) {
          setHighlights(prev => {
            const list = prev[activeQ.id] || [];
            if (!list.includes(selected)) {
              return { ...prev, [activeQ.id]: [...list, selected] };
            }
            return prev;
          });
        }
      };

      const handleClearHighlights = () => {
        if (!activeQ) return;
        setHighlights(prev => ({ ...prev, [activeQ.id]: [] }));
      };

      if (stage === 'break') {
        return (
          <SectionBreakScreen
            onResume={() => {
              setStage('math-m1');
              setCurrentQIndex(0);
              setTimeRemaining(35 * 60);
              setQEnterTime(Date.now());
            }}
          />
        );
      }

      const mins = Math.floor(timeRemaining / 60);
      const secs = timeRemaining % 60;
      const formattedTime = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      const answeredCount = currentModuleQuestions.filter(q => answers[q.id] !== undefined && answers[q.id] !== "").length;
      const flaggedCount = currentModuleQuestions.filter(q => bookmarks[q.id]).length;
      const isMath = activeQ?.section === 'math';

      return (
        <div className="h-full flex flex-col bg-slate-100 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100">
          {/* Proctored Header */}
          <header className="h-14 bg-slate-900 text-white flex items-center justify-between px-4 sm:px-6 border-b border-slate-800 shrink-0">
            <div className="flex items-center space-x-2 sm:space-x-3">
              <span className="font-bold tracking-tight text-sm uppercase text-indigo-400">
                Mock Exam {examId}
              </span>
              <span className="text-slate-500">|</span>
              <span className="text-sm font-medium text-slate-200">
                {stage === 'rw-m1' && "Section 1: Reading & Writing — Module 1"}
                {stage === 'rw-m2' && `Section 1: Reading & Writing — Module 2 (${rwTier === 'hard' ? 'Hard Tier' : 'Standard Tier'})`}
                {stage === 'math-m1' && "Section 2: Math — Module 1"}
                {stage === 'math-m2' && `Section 2: Math — Module 2 (${mathTier === 'hard' ? 'Hard Tier' : 'Standard Tier'})`}
              </span>
            </div>

            {/* Central Countdown Timer */}
            <div className="flex items-center space-x-2 sm:space-x-3">
              <span className="hidden xl:inline-flex items-center space-x-1.5 text-[11px] text-slate-300 bg-slate-800/60 px-2.5 py-1 rounded-lg border border-slate-700/60 font-mono">
                <span>[A-D] Select</span>
                <span>•</span>
                <span>[←/→] Navigate</span>
                <span>•</span>
                <span>[Esc] Modal</span>
              </span>
              <div className="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                <Icon name="Clock" className="w-4 h-4 text-slate-300" />
                <span className={`font-mono font-bold text-sm ${timeRemaining < 300 ? 'text-amber-400' : 'text-white'}`}>
                  {isTimerHidden ? "Timer Hidden" : formattedTime}
                </span>
                <button
                  onClick={() => setIsTimerHidden(!isTimerHidden)}
                  className="text-xs text-indigo-400 hover:text-indigo-300 ml-1 underline focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none rounded"
                >
                  {isTimerHidden ? "Show" : "Hide"}
                </button>
              </div>

              <button
                onClick={handlePause}
                className="px-2.5 py-1 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
              >
                Pause
              </button>
            </div>

            {/* In-Exam Tools */}
            <div className="flex items-center space-x-2">
              {isMath && (
                <>
                  <button
                    onClick={() => setIsCalcOpen(true)}
                    className="flex items-center space-x-1 px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-indigo-300 rounded-lg border border-slate-700 transition active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
                  >
                    <Icon name="Calculator" className="w-4 h-4" />
                    <span>Calculator</span>
                  </button>
                  <button
                    onClick={() => setIsRefOpen(true)}
                    className="flex items-center space-x-1 px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-indigo-300 rounded-lg border border-slate-700 transition active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
                  >
                    <Icon name="Award" className="w-4 h-4" />
                    <span>Reference</span>
                  </button>
                </>
              )}
              <button
                onClick={onExitExam}
                className="px-3 py-1.5 text-xs font-medium text-slate-400 hover:text-rose-400 rounded-lg transition active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-rose-500 focus-visible:outline-none"
              >
                Exit Test
              </button>
            </div>
          </header>

          {/* 5-Minute Warning Toast */}
          {show5MinAlert && (
            <div className="bg-amber-500 text-slate-950 px-4 py-2 text-center text-sm font-bold flex items-center justify-center space-x-2 shadow">
              <Icon name="AlertTriangle" className="w-4 h-4" />
              <span>5 minutes remaining in this module! Double-check all unanswered and flagged questions.</span>
            </div>
          )}

          {/* Split-Screen Workspace */}
          <div className="flex-1 flex overflow-hidden">
            {/* Left Pane: Stimulus / Passage (if present) */}
            {activeQ?.passage && (
              <div className="w-1/2 border-r border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/90 flex flex-col">
                <div className="h-9 px-4 sm:px-5 border-b border-slate-200 dark:border-zinc-800 flex items-center justify-between text-xs text-slate-500 dark:text-zinc-400 bg-slate-50 dark:bg-zinc-900">
                  <span className="font-semibold uppercase tracking-wider text-[11px]">Passage / Stimulus</span>
                  <div className="flex items-center space-x-2.5">
                    <button
                      onClick={handleAddHighlight}
                      className="px-2 py-0.5 rounded bg-amber-100 hover:bg-amber-200 dark:bg-amber-900/50 dark:hover:bg-amber-900 text-amber-800 dark:text-amber-200 font-medium transition active:scale-95 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
                      title="Select text and click to highlight"
                    >
                      Highlight
                    </button>
                    <button
                      onClick={handleClearHighlights}
                      className="hover:text-slate-800 dark:hover:text-zinc-200 transition active:scale-95 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
                    >
                      Clear
                    </button>
                    <span className="text-slate-300">|</span>
                    <button onClick={() => setFontSize(prev => Math.max(13, prev - 1))} className="px-1 font-bold active:scale-95 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none rounded">A-</button>
                    <button onClick={() => setFontSize(prev => Math.min(22, prev + 1))} className="px-1 font-bold active:scale-95 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none rounded">A+</button>
                  </div>
                </div>

                <div
                  className="flex-1 p-5 sm:p-6 overflow-y-auto font-serif leading-relaxed text-slate-800 dark:text-zinc-200 select-text"
                  style={{ fontSize: `${fontSize}px` }}
                >
                  <p className="whitespace-pre-line">
                    {renderPassageWithHighlights(activeQ.passage, highlights[activeQ.id] || [])}
                  </p>
                </div>
              </div>
            )}

            {/* Right Pane: Question & Options / SPR Grid-In */}
            <div className={`${activeQ?.passage ? 'w-1/2' : 'w-full max-w-4xl mx-auto'} bg-slate-50 dark:bg-zinc-950 flex flex-col`}>
              <div className="h-9 px-4 sm:px-6 border-b border-slate-200 dark:border-zinc-800 flex items-center justify-between text-xs text-slate-500 dark:text-zinc-400 bg-white dark:bg-zinc-900">
                <span className="font-bold text-slate-800 dark:text-zinc-200">
                  Question {currentQIndex + 1} of {currentModuleQuestions.length}
                </span>

                <button
                  onClick={toggleBookmark}
                  aria-label={bookmarks[activeQ?.id] ? 'Question marked for review. Click to unmark.' : 'Mark question for review'}
                  className={`flex items-center space-x-1.5 px-3 py-1 rounded-lg text-xs font-semibold transition active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none ${
                    bookmarks[activeQ?.id]

                  <div className="space-y-2.5" role="radiogroup" aria-label="Answer options">
                    {activeQ.options.map((optStr, optIdx) => {
                      const letter = ['A', 'B', 'C', 'D'][optIdx];
                      const isSelected = answers[activeQ.id] === letter;
                      const isEliminated = eliminations[activeQ.id] && eliminations[activeQ.id][letter];

                      return (
                        <div
                          key={letter}
                          role="radio"
                          aria-checked={isSelected}
                          aria-disabled={isEliminated}
                          tabIndex={0}
                          onClick={() => handleAnswerSelect(letter)}
                          onKeyDown={(e) => {
                            if (e.key === ' ' || e.key === 'Enter') {
                              e.preventDefault();
                              handleAnswerSelect(letter);
                            }
                          }}
                          className={`group relative flex items-start px-4 py-3 rounded-xl border cursor-pointer transition select-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none active:scale-[0.99] ${

                              ? 'opacity-40 bg-slate-100 dark:bg-zinc-900 border-dashed border-slate-300 dark:border-zinc-800 line-through'

                        >

                          </div>

                          {/* Strikethrough Eliminator Toggle */}
                          <button

                            className={`p-1.5 rounded-lg text-xs font-mono ml-2 transition focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none active:scale-95 ${
                              isEliminated

                          </button>

                      );

                {/* Student-Produced Response (SPR Grid-in) */}
                {!activeQ?.options && (
                  <div className="mt-4 p-5 sm:p-6 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl max-w-md">

                      type="text"
                      maxLength={6}
                      value={answers[activeQ?.id] || ""}
                      onChange={(e) => {

                      placeholder="e.g. 7/2, 3.5, or -4"

                    />

                    {/* Live Preview Indicator */}
                    {answers[activeQ?.id] && answers[activeQ?.id].includes('/') && (
                      <div className="mt-2 text-xs font-mono text-indigo-600 dark:text-indigo-400">

                    )}
                    <p className="mt-3 text-xs text-slate-500 leading-relaxed">
                      Enter up to 5 characters for positive numbers or 6 for negative numbers. Fractions (e.g. 7/2) and decimals (3.5) are equally accepted. Mixed numbers like 3 1/2 are not permitted.
                    </p>
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Exam Footer Bar */}
          <footer className="h-14 bg-white dark:bg-zinc-900 border-t border-slate-200 dark:border-zinc-800 flex items-center justify-between px-4 sm:px-6 shrink-0">

          </footer>

          <QuestionReviewMatrixModal

          if (difficultyFilter !== 'all' && item.difficulty !== difficultyFilter) return false;
          return true;
        });

        const x = radarCenter + r * Math.cos(angle);
        const y = radarCenter + r * Math.sin(angle);
        return `${x.toFixed(1)},${y.toFixed(1)}`;

                {[0.25, 0.5, 0.75, 1.0].map((scale, sIdx) => (
                  <circle
                    key={sIdx}
                    cx={radarCenter}
                    cy={radarCenter}
                    r={radarRadius * scale}
                    fill="none"
                    stroke="currentColor"
                    strokeDasharray={scale === 1.0 ? "none" : "3,3"}
                    className="text-slate-200 dark:text-zinc-800"
                  />
                ))}

                {/* 8 Axes */}
                {DOMAINS.map((dom, i) => {
                  const angle = (i * 2 * Math.PI) / 8 - Math.PI / 2;
                  const x = radarCenter + radarRadius * Math.cos(angle);
                  const y = radarCenter + radarRadius * Math.sin(angle);
                  const labelX = radarCenter + (radarRadius + 22) * Math.cos(angle);
                  const labelY = radarCenter + (radarRadius + 22) * Math.sin(angle);

                  return (
                    <g key={dom.id}>
                      <line
                        x1={radarCenter}
                        y1={radarCenter}
                        x2={x}
                        y2={y}
                        stroke="currentColor"
                        className="text-slate-200 dark:text-zinc-800"
                      />
                      <text
                        x={labelX}
                        y={labelY + 4}
                        textAnchor="middle"
                        className="text-[9px] font-bold fill-slate-500 dark:fill-zinc-400"

                  {DOMAINS.map(d => {
                    const st = domainStats?.[d.id] || { totalQuestions: 0, correctQuestions: 0, accuracyPercentage: 0 };

                    const barColor = acc >= 80 ? 'bg-emerald-500' : acc >= 60 ? 'bg-amber-500' : 'bg-rose-500';

                    return (
                      <div key={d.id}>
                        <div className="flex justify-between text-xs font-semibold mb-1">
                          <span className="text-slate-800 dark:text-zinc-200">{d.name}</span>
                          <span className="font-mono text-slate-500">{st.correctQuestions}/{st.totalQuestions} ({acc}%)</span>

                        <div className="h-2 w-full bg-slate-100 dark:bg-zinc-800 rounded-full overflow-hidden">

            <p className="text-xs text-slate-600 dark:text-zinc-400 mb-5">

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {weakTypes.map((item, idx) => {
                const navTarget = QUESTION_TYPE_TO_LESSON_MAP[item.qType] || { domainId: 'craft-and-structure' };
                return (
                  <div key={idx} className="p-4 bg-slate-50 dark:bg-zinc-800/60 rounded-xl border border-slate-200 dark:border-zinc-700/60 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-[10px] font-bold uppercase tracking-wider text-rose-600 dark:text-rose-400 bg-rose-100 dark:bg-rose-950 px-2 py-0.5 rounded-full">
                          Priority #{idx + 1}
                        </span>
                        <span className="text-xs font-mono font-bold text-slate-700 dark:text-zinc-300">
                          {item.accuracy}% Accuracy
                        </span>

                      <h4 className="text-sm font-bold text-slate-900 dark:text-white capitalize mb-1">

                      <span>Review Lesson</span>

          {/* Pacing Diagnostic Timeline */}

            <div className="flex items-center justify-between mb-2">

                <Icon name="Clock" className="w-5 h-5" />
                <h3>Pacing Diagnostic Analysis</h3>

              <div className="text-xs font-mono text-slate-500 font-bold">
                Average: {pacingSummary?.avgSecondsPerQuestion || 71}s / question

            <p className="text-xs text-slate-600 dark:text-zinc-400 mb-5">
              Flagged items: Rushed (&lt;30s: potential careless errors) and Stalled (&gt;120s: excessive time sinks).

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3.5 mb-2">
              <div className="p-3 bg-slate-50 dark:bg-zinc-800 rounded-xl text-center">
                <div className="text-xl font-bold font-mono text-slate-900 dark:text-white">{pacingSummary?.avgSecondsPerQuestion || 71}s</div>
                <div className="text-[11px] text-slate-500">Average Pace</div>
              </div>
              <div className="p-3 bg-amber-50 dark:bg-amber-950/40 rounded-xl text-center">
                <div className="text-xl font-bold font-mono text-amber-600 dark:text-amber-400">{pacingSummary?.rushedQuestionCount || 0}</div>

    // ==========================================
    // 18. SETTINGS VIEW
    // ==========================================
    function SettingsView({ state, toggleTheme, exportStateJson, importStateJson, resetAllData }) {
      const fileInputRef = React.useRef(null);
      const [importStatus, setImportStatus] = React.useState(null);
      const [resetConfirmText, setResetConfirmText] = React.useState("");
      const [showResetModal, setShowResetModal] = React.useState(false);

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const content = event.target?.result;
          if (typeof content === 'string') {
            const res = importStateJson(content);
            setImportStatus(res);
            setTimeout(() => setImportStatus(null), 5000);
          }
        };
        reader.readAsText(file);
      };

      const handleConfirmReset = () => {
        if (resetConfirmText === 'RESET') {
          resetAllData();
          setShowResetModal(false);
          setResetConfirmText("");
        }
      };

      return (
        <div className="max-w-4xl mx-auto px-4 sm:px-6 py-5 sm:py-6">
          <div className="mb-6">
            <h1 className="text-2xl font-extrabold text-slate-900 dark:text-white">Settings & Data Management</h1>
            <p className="text-xs sm:text-sm text-slate-600 dark:text-zinc-400 mt-1">
              Configure interface preferences, export full student diagnostic backups, and manage local storage.
            </p>
          </div>

          <div className="space-y-4">
            {/* Appearance Preference */}
            <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl p-5 shadow-sm">
              <h3 className="text-base font-bold text-slate-900 dark:text-white mb-1.5">Display & Appearance</h3>
              <p className="text-xs text-slate-600 dark:text-zinc-400 mb-4">
                Switch between high-contrast light mode and distraction-free dark mode.
              </p>
              <div className="flex items-center justify-between">
                <span className="text-sm font-medium text-slate-700 dark:text-zinc-300">
                  Active Theme: <strong className="capitalize">{state.settings.theme}</strong>
                </span>
                <button
                  onClick={toggleTheme}
                  className="px-4 py-2 bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 dark:hover:bg-zinc-700 active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none rounded-xl text-xs font-semibold flex items-center space-x-2 transition"
                >
                  <Icon name={state.settings.theme === 'dark' ? 'Sun' : 'Moon'} className="w-4 h-4 text-amber-500" />
                  <span>Toggle to {state.settings.theme === 'dark' ? 'Light Mode' : 'Dark Mode'}</span>
                </button>
              </div>
            </div>

            {/* Backup & Restore */}
            <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl p-5 shadow-sm">
              <h3 className="text-base font-bold text-slate-900 dark:text-white mb-1.5">JSON Export & Import</h3>
              <p className="text-xs text-slate-600 dark:text-zinc-400 mb-4">
                Export your complete test history, notes, and preferences to a JSON file, or restore from a previous backup.
              </p>

              <div className="flex flex-wrap gap-3.5 items-center">
                <button
                  onClick={exportStateJson}
                  className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none text-white rounded-xl font-semibold text-xs shadow flex items-center space-x-2 transition"
                >
                  <Icon name="Download" className="w-4 h-4" />
                  <span>Export Backup (JSON)</span>
                </button>

                <input
                  type="file"
                  accept=".json"
                  ref={fileInputRef}
                  onChange={handleFileChange}
                  className="hidden"
                />

                <button
                  onClick={() => fileInputRef.current?.click()}
                  className="px-5 py-2.5 bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 dark:hover:bg-zinc-700 active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none text-slate-800 dark:text-zinc-200 rounded-xl font-semibold text-xs border border-slate-200 dark:border-zinc-700 flex items-center space-x-2 transition"
                >
                  <Icon name="Upload" className="w-4 h-4" />
                  <span>Import Backup (JSON)</span>
                </button>
              </div>

              {importStatus && (
                <div className={`mt-4 p-3 rounded-xl text-xs font-semibold ${
                  importStatus.success ? 'bg-emerald-50 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200' : 'bg-rose-50 text-rose-800 dark:bg-rose-950 dark:text-rose-200'
                }`}>
                  {importStatus.message}
                </div>
              )}
            </div>

            {/* Clear Data Reset */}
            <div className="bg-white dark:bg-zinc-900 border border-rose-200 dark:border-rose-950 rounded-xl p-5 shadow-sm">
              <h3 className="text-base font-bold text-rose-600 dark:text-rose-400 mb-1.5">Danger Zone: Complete Data Reset</h3>
              <p className="text-xs text-slate-600 dark:text-zinc-400 mb-4">
                Permanently erase all exam history, scores, notes, and drill logs from localStorage.
              </p>

              <button
                onClick={() => setShowResetModal(true)}
                className="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-rose-500 focus-visible:outline-none text-white rounded-xl font-semibold text-xs shadow flex items-center space-x-2 transition"
              >
                <Icon name="Trash2" className="w-4 h-4" />
                <span>Reset All Student Data</span>
              </button>
            </div>
          </div>

          {/* Reset Confirmation Modal */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                <h3 className="text-lg font-bold text-rose-600 dark:text-rose-400 mb-2">Confirm Complete Reset</h3>
                <p className="text-xs text-slate-600 dark:text-zinc-400 mb-4">
                  This action is irreversible. Type <strong className="text-rose-600">RESET</strong> below to confirm wiping all progress.
                </p>

                <input
                  type="text"
                  value={resetConfirmText}
                  onChange={(e) => setResetConfirmText(e.target.value)}
                  placeholder="Type RESET"
                  className="w-full px-4 py-2.5 bg-slate-50 dark:bg-zinc-950 border border-slate-300 dark:border-zinc-700 rounded-xl text-sm font-mono mb-4 text-slate-900 dark:text-white"
                />

                <div className="flex justify-end space-x-3">
                  <button
                    onClick={() => {
                      setShowResetModal(false);
                      setResetConfirmText("");
                    }}
                    className="px-4 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs font-semibold text-slate-600 dark:text-zinc-400 active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:outline-none"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleConfirmReset}
                    disabled={resetConfirmText !== 'RESET'}
                    className="px-4 py-2 bg-rose-600 hover:bg-rose-700 disabled:opacity-40 text-white rounded-xl text-xs font-semibold active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-rose-500 focus-visible:outline-none"
                  >
                    Confirm Reset
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

      const {
        state,
        toggleTheme,
        saveExamAttempt,
        recordDrillResult,
        exportStateJson,
        importStateJson,
        resetAllData
      } = useSatStorage();

      // Current view: 'lessons' | 'drills' | 'mocks' | 'analytics' | 'settings' | 'exam'
      const [currentView, setCurrentView] = React.useState('lessons');
      const [activeExamId, setActiveExamId] = React.useState(null);
      const [targetLessonDomain, setTargetLessonDomain] = React.useState(null);
      const [targetDrillDomain, setTargetDrillDomain] = React.useState(null);

      // Lifted drill state to guarantee zero-reload state preservation across tab switches
      const [drillAnswers, setDrillAnswers] = React.useState({});
      const [drillSubmitted, setDrillSubmitted] = React.useState({});

      const handleStartExam = (examNum) => {
        setActiveExamId(examNum);
        setCurrentView('exam');
      };

      const handleExitExam = () => {
        if (confirm("Are you sure you want to exit the exam? Your progress will be saved in memory.")) {
          setCurrentView('mocks');
        }
      };

      const handleFinishExam = (attemptRecord) => {
        saveExamAttempt(attemptRecord);
        setActiveExamId(null);
        setCurrentView('analytics');
      };

      const handleNavigateToLesson = (domainId, questionType) => {
        setTargetLessonDomain(domainId);
        setCurrentView('lessons');
      };

      const handleNavigateToDrills = (domainId) => {
        setTargetDrillDomain(domainId);
        setCurrentView('drills');
      };

      // If active exam is open: currentView === 'exam' && activeExamId

      return (
        <div className="min-h-full flex flex-col bg-slate-50 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100">

                  </button>
                )}
              </div>
            </div>
          </nav>

          {/* Student Motivation & Momentum Ribbon */}
          <div className="bg-gradient-to-r from-indigo-50/90 via-white to-slate-50 dark:from-zinc-900 dark:via-zinc-900/90 dark:to-zinc-950 border-b border-slate-200/80 dark:border-zinc-800/80 px-4 sm:px-6 py-2 shadow-xs">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3 text-xs">
              <div className="flex items-center space-x-2.5">
                <span className="flex h-2 w-2 relative">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span className="font-semibold text-slate-700 dark:text-zinc-300">
                  Welcome back, <span className="text-indigo-600 dark:text-indigo-400 font-bold">Future Top Scorer</span>! Ready to level up your score?
                </span>
                <span className="hidden md:inline text-slate-300 dark:text-zinc-700">•</span>
                <span className="hidden md:inline text-slate-500 dark:text-zinc-400">
                  Target Score: <strong className="text-slate-800 dark:text-zinc-200 font-mono">1550+</strong>
                </span>
              </div>

              <div className="flex items-center space-x-3 text-slate-600 dark:text-zinc-400 font-medium">
                <div className="flex items-center space-x-1.5 bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 px-2.5 py-0.5 rounded-full border border-amber-200/60 dark:border-amber-800/40 font-semibold text-[11px]">
                  <span>🔥</span>
                  <span>5-Day Streak</span>
                </div>
                <div className="hidden sm:flex items-center space-x-1 text-slate-500 dark:text-zinc-400 text-xs">
                  <Icon name="Activity" className="w-3.5 h-3.5 text-indigo-500" />
                  <span>{state.examHistory.length} {state.examHistory.length === 1 ? 'Exam' : 'Exams'} Completed</span>
                </div>
              </div>
            </div>
          </div>

          {/* Main View Router */}
          <main className="flex-1">
            {currentView === 'lessons' && (
              <LessonsView
                activeDomainId={targetLessonDomain}
                onSelectDomain={(dId) => setTargetLessonDomain(dId)}
                onNavigateToDrills={handleNavigateToDrills}
              />
            )}

            {currentView === 'drills' && (
              <DrillsView
                initialDomainId={targetDrillDomain}
                onRecordDrill={recordDrillResult}
                externalAnswers={drillAnswers}
                setExternalAnswers={setDrillAnswers}
                externalSubmitted={drillSubmitted}
                setExternalSubmitted={setDrillSubmitted}
              />
            )}

            {currentView === 'mocks' && (
              <MocksHubView
                onStartExam={handleStartExam}
                examHistory={state.examHistory}
                activeExamId={activeExamId}
              />
            )}

            {currentView === 'analytics' && (
              <AnalyticsView
                examHistory={state.examHistory}
                onNavigateToLesson={handleNavigateToLesson}
              />
            )}

            {currentView === 'settings' && (
              <SettingsView
                state={state}
                toggleTheme={toggleTheme}
                exportStateJson={exportStateJson}
                importStateJson={importStateJson}
                resetAllData={resetAllData}
              />
            )}
          </main>
        </div>
      );
    }

    // ==========================================
    // 16. APPLICATION ERROR BOUNDARY
    // ==========================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught an unhandled rendering error:", error, errorInfo);
        this.setState({ errorInfo });
      }

      handleReset = () => {
        this.setState({ hasError: false, error: null, errorInfo: null });
        window.location.reload();
      };

      handleClearDataAndReload = () => {
        try {
          localStorage.removeItem("DIGITAL_SAT_APP_STATE_V1");
        } catch (e) {
          console.warn("Could not clear localStorage:", e);
        }
        window.location.reload();
      };

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-6">
              <div className="max-w-lg w-full bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl text-center">
                <div className="w-16 h-16 bg-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center mx-auto mb-6">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                  </svg>
                </div>
                <h2 className="text-2xl font-bold mb-3 text-white">Something went wrong</h2>
                <p className="text-sm text-slate-300 mb-6 leading-relaxed">
                  An unexpected rendering error occurred in the Digital SAT testing platform. Your progress is saved in local storage.
                </p>
                {this.state.error && (
                  <pre className="text-xs bg-slate-950 text-rose-300 p-4 rounded-xl text-left overflow-x-auto mb-6 max-h-32 font-mono border border-slate-700">
                    {this.state.error.toString()}
                  </pre>
                )}
                <div className="flex flex-col sm:flex-row gap-3 justify-center">
                  <button
                    onClick={this.handleReset}
                    className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-indigo-600/30"
                  >
                    Reload Application
                  </button>
                  <button
                    onClick={this.handleClearDataAndReload}
                    className="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded-xl text-sm transition"
                  >
                    Reset Storage & Reload
                  </button>
                </div>
              </div>
            </div>
          );
        }

        return this.props.children;
      }
    }

    // Export core modules for Node and browser test runners
    if (typeof window !== 'undefined') {
      window.MOCK_1_DATA = MOCK_1_DATA;
      window.CURRICULUM_DATA = CURRICULUM_DATA;
      window.DRILL_ITEMS = DRILL_ITEMS;
      window.DOMAINS = DOMAINS;
      window.QUESTION_TYPES = QUESTION_TYPES;
      window.QUESTION_TYPE_TO_LESSON_MAP = QUESTION_TYPE_TO_LESSON_MAP;
      window.evaluateGridIn = evaluateGridIn;
      window.calculateScaledScore = calculateScaledScore;
      window.calculateCompositeScore = calculateCompositeScore;
      window.ExamScaffoldEngine = ExamScaffoldEngine;
      window.ErrorBoundary = ErrorBoundary;
    }

    if (typeof module !== 'undefined' && module.exports) {
      module.exports = {
        MOCK_1_DATA,
        CURRICULUM_DATA,
        DRILL_ITEMS,
        DOMAINS,
        QUESTION_TYPES,
        QUESTION_TYPE_TO_LESSON_MAP,
        evaluateGridIn,
        calculateScaledScore,
        calculateCompositeScore,
        ExamScaffoldEngine,
        ErrorBoundary
      };
    }

    // Mount React App
    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
