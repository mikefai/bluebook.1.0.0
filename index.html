            <div className="my-6 p-4 bg-slate-100 dark:bg-zinc-800 rounded-xl">
              <div className="text-4xl font-mono font-bold text-slate-900 dark:text-white">{formatted}</div>
              <div className="text-xs text-slate-500 dark:text-zinc-400 mt-1">Break Time Remaining</div>
            </div>
            <button
              onClick={onResume}
              className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold shadow transition"
            >
              Resume Testing Now (Start Math Module 1)
            </button>
          </div>
        </div>
      );
    }
    // ==========================================
    // 13. BLUEBOOK PROCTORED TESTING SHELL
    // ==========================================
    function ExamProctoredShell({ examId, onExitExam, onFinishExam, isHidden = false, customNotes = {}, onSaveNote = null }) {
      const scaffold = React.useMemo(() => new ExamScaffoldEngine(examId * 9999 + 1337), [examId]);
      const examQuestions = React.useMemo(() => scaffold.generateExam(examId), [examId, scaffold]);

      // Testing Stages: 'rw-m1' | 'rw-m2' | 'break' | 'math-m1' | 'math-m2'
      const [stage, setStage] = React.useState('rw-m1');
      const [currentQIndex, setCurrentQIndex] = React.useState(0);
      const [answers, setAnswers] = React.useState({});
      const [bookmarks, setBookmarks] = React.useState({});
      const [eliminations, setEliminations] = React.useState({}); // { [qId]: { 'A': true } }
      const [highlights, setHighlights] = React.useState({}); // { [qId]: [{ text, color } | 'phrase'] }
      const [timeSpent, setTimeSpent] = React.useState({}); // { [qId]: seconds }
      const [qEnterTime, setQEnterTime] = React.useState(Date.now());

      // Practice Mode (Untimed by default — no mandatory countdown!)
      const [isPracticeMode, setIsPracticeMode] = React.useState(true);
      const [practiceElapsed, setPracticeElapsed] = React.useState(0);
      const [showPracticeSolution, setShowPracticeSolution] = React.useState(false);

      // Student & Lesson Friendly Tools State
      const [highlightColor, setHighlightColor] = React.useState('yellow');
      const [autoHighlight, setAutoHighlight] = React.useState(true);
      const [isDrawOpen, setIsDrawOpen] = React.useState(false);
      const [drawings, setDrawings] = React.useState({});
      const [isNotepadOpen, setIsNotepadOpen] = React.useState(false);

      // Timing state: 32m for RW, 35m for Math (used only if user switches from Practice Mode to Timed Mode)
      const [timeRemaining, setTimeRemaining] = React.useState(32 * 60);
      const [isTimerHidden, setIsTimerHidden] = React.useState(false);
      const [isPaused, setIsPaused] = React.useState(false);
      const [show5MinAlert, setShow5MinAlert] = React.useState(false);

      // Modals
      const [isReviewOpen, setIsReviewOpen] = React.useState(false);
      const [isCalcOpen, setIsCalcOpen] = React.useState(false);
      const [isRefOpen, setIsRefOpen] = React.useState(false);
      const [isTipOpen, setIsTipOpen] = React.useState(false);
      const [fontSize, setFontSize] = React.useState(16); // 16px default

      // Adaptive Routing Tracking
      const [rwM1Raw, setRwM1Raw] = React.useState(null);
      const [mathM1Raw, setMathM1Raw] = React.useState(null);
      const [rwTier, setRwTier] = React.useState(null);
      const [mathTier, setMathTier] = React.useState(null);

      // Filter questions for active module
      const currentModuleQuestions = React.useMemo(() => {
        if (stage === 'rw-m1') {
          return examQuestions.filter(q => q.section === 'reading-writing' && q.module === 1);
        } else if (stage === 'rw-m2') {
          return examQuestions.filter(q => q.section === 'reading-writing' && q.module === 2);
        } else if (stage === 'math-m1') {
          return examQuestions.filter(q => q.section === 'math' && q.module === 1);
        } else if (stage === 'math-m2') {
          return examQuestions.filter(q => q.section === 'math' && q.module === 2);
        }
        return [];
      }, [stage, examQuestions]);

      const activeQ = currentModuleQuestions[currentQIndex] || currentModuleQuestions[0];
      const isEasyMock = examId <= 4;
      const isReadingQuestion = activeQ?.section === 'reading-writing';
      const activeTip = (isEasyMock && isReadingQuestion && activeQ) ? getReadingQuestionTip(activeQ) : null;

      React.useEffect(() => {
        setIsTipOpen(false);
        setShowPracticeSolution(false);
      }, [activeQ?.id, stage, examId]);

      // Track time spent on question transitions
      const recordTimeForActiveQ = React.useCallback(() => {
        if (!activeQ) return;
        const now = Date.now();
        const elapsed = Math.round((now - qEnterTime) / 1000);
        setTimeSpent(prev => ({
          ...prev,
          [activeQ.id]: (prev[activeQ.id] || 0) + elapsed
        }));
        setQEnterTime(now);
      }, [activeQ, qEnterTime]);

      const handleModuleSubmitRef = React.useRef(null);

      // Timer interval (Untimed in Practice Mode; optional countdown only if Timed Mode is toggled)
      React.useEffect(() => {
        if (isPaused || stage === 'break') return;
        if (isHidden) return;

        if (isPracticeMode) {
          const practiceInterval = setInterval(() => {
            setPracticeElapsed(prev => prev + 1);
          }, 1000);
          return () => clearInterval(practiceInterval);
        }

        const interval = setInterval(() => {
          setTimeRemaining(prev => {
            if (prev <= 1) { clearInterval(interval); handleModuleSubmit();
              setTimeout(() => {
                if (handleModuleSubmitRef.current) handleModuleSubmitRef.current();
              }, 0);
              return 0;
            }
            // 5-minute unhide trigger
            if (prev === 300) {
              setIsTimerHidden(false);
              setShow5MinAlert(true);
              setTimeout(() => setShow5MinAlert(false), 6000);
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(interval);
      }, [isPaused, isHidden, isPracticeMode, stage]);

      // Module Transition Logic
      const handleModuleSubmit = () => {
        recordTimeForActiveQ();

        if (stage === 'rw-m1') {
          // Calculate RW M1 Score
          const m1Qs = examQuestions.filter(q => q.section === 'reading-writing' && q.module === 1);
          let correct = 0;
          m1Qs.forEach(q => {
            if (answers[q.id] === q.correctAnswer) correct++;
          });
          setRwM1Raw(correct);
          const tier = correct >= 18 ? 'hard' : 'easy';
          setRwTier(tier);

          // Move to RW M2
          setStage('rw-m2');
          setCurrentQIndex(0);
          setTimeRemaining(32 * 60);
          setQEnterTime(Date.now());
        } else if (stage === 'rw-m2') {
          // Move to 10-minute break
          setStage('break');
        } else if (stage === 'math-m1') {
          // Calculate Math M1 Score
          const m1MathQs = examQuestions.filter(q => q.section === 'math' && q.module === 1);
          let correct = 0;
          m1MathQs.forEach(q => {
            if (q.options) {
              if (answers[q.id] === q.correctAnswer) correct++;
            } else {
              if (evaluateGridIn(answers[q.id], q.correctAnswer).isCorrect) correct++;
            }
          });
          setMathM1Raw(correct);
          const tier = correct >= 15 ? 'hard' : 'easy';
          setMathTier(tier);

          // Move to Math M2
          setStage('math-m2');
          setCurrentQIndex(0);
          setTimeRemaining(35 * 60);
          setQEnterTime(Date.now());
        } else if (stage === 'math-m2') {
          // Complete Exam and calculate final diagnostic scores!
          finalizeExamAttempt();
        }
      };
      handleModuleSubmitRef.current = handleModuleSubmit;

      const finalizeExamAttempt = () => {
        recordTimeForActiveQ();

        // Count scores
        let rwM1Count = 0;
        let rwM2Count = 0;
        let mathM1Count = 0;
        let mathM2Count = 0;

        const domainStats = {};
        DOMAINS.forEach(d => {
          domainStats[d.id] = { totalQuestions: 0, correctQuestions: 0, accuracyPercentage: 0 };
        });

        const questionTypeStats = {};
        const rawResults = {};

        examQuestions.forEach(q => {
          const uAns = answers[q.id];
          let isCorr = false;
          if (q.options) {
            isCorr = (uAns === q.correctAnswer);
          } else {
            isCorr = evaluateGridIn(uAns, q.correctAnswer).isCorrect;
          }
          rawResults[q.id] = isCorr;

          if (q.section === 'reading-writing') {
            if (q.module === 1 && isCorr) rwM1Count++;
            if (q.module === 2 && isCorr) rwM2Count++;
          } else {
            if (q.module === 1 && isCorr) mathM1Count++;
            if (q.module === 2 && isCorr) mathM2Count++;
          }

          // Domain aggregation
          if (domainStats[q.domain]) {
            domainStats[q.domain].totalQuestions++;
            if (isCorr) domainStats[q.domain].correctQuestions++;
          }

          // Question type aggregation
          if (!questionTypeStats[q.questionType]) {
            questionTypeStats[q.questionType] = { totalQuestions: 0, correctQuestions: 0, accuracyPercentage: 0 };
          }
          questionTypeStats[q.questionType].totalQuestions++;
          if (isCorr) questionTypeStats[q.questionType].correctQuestions++;
        });

        // Compute domain percentages
        Object.keys(domainStats).forEach(domId => {
          const st = domainStats[domId];
          st.accuracyPercentage = st.totalQuestions > 0 ? Math.round((st.correctQuestions / st.totalQuestions) * 100) : 0;
        });

        // Compute question type percentages
        Object.keys(questionTypeStats).forEach(qtId => {
          const qt = questionTypeStats[qtId];
          qt.accuracyPercentage = qt.totalQuestions > 0 ? Math.round((qt.correctQuestions / qt.totalQuestions) * 100) : 0;
        });

        // Scaled Scores
        const rwScoreObj = calculateScaledScore(rwM1Count, rwM2Count, 'reading-writing');
        const mathScoreObj = calculateScaledScore(mathM1Count, mathM2Count, 'math');
        const compositeObj = calculateCompositeScore(rwScoreObj.scaledScore, mathScoreObj.scaledScore);

        // Pacing metrics
        const times = Object.values(timeSpent);
        const totalDuration = times.reduce((a, b) => a + b, 0);
        const avgSec = times.length > 0 ? Math.round(totalDuration / times.length) : 70;
        const rushed = times.filter(t => t < 30).length;
        const stalled = times.filter(t => t > 120).length;

        const attemptRecord = {
          id: `attempt-${Date.now()}`,
          examId,
          completedAt: new Date().toISOString(),
          totalDurationSeconds: totalDuration,
          scores: {
            composite: compositeObj.composite,
            readingWriting: rwScoreObj.scaledScore,
            math: mathScoreObj.scaledScore,
            rwM1Raw: rwM1Count,
            rwM2Raw: rwM2Count,
            rwTier: rwScoreObj.tier,
            mathM1Raw: mathM1Count,
            mathM2Raw: mathM2Count,
            mathTier: mathScoreObj.tier
          },
          domainStats,
          questionTypeStats,
          pacingSummary: {
            avgSecondsPerQuestion: avgSec,
            rushedQuestionCount: rushed,
            stalledQuestionCount: stalled,
            timeSpentPerQuestion: timeSpent
          },
          answers,
          rawQuestionResults: rawResults
        };

        onFinishExam(attemptRecord);
      };

      const handleNext = () => {
        recordTimeForActiveQ();
        if (currentQIndex < currentModuleQuestions.length - 1) {
          setCurrentQIndex(prev => prev + 1);
        } else {
          setIsReviewOpen(true);
        }
      };

      const handlePrev = () => {
        recordTimeForActiveQ();
        if (currentQIndex > 0) {
          setCurrentQIndex(prev => prev - 1);
        }
      };

      const handleAnswerSelect = (optLetter) => {
        if (!activeQ) return;
        setAnswers(prev => ({ ...prev, [activeQ.id]: optLetter }));
        // If this option was eliminated, un-eliminate it
        if (eliminations[activeQ.id] && eliminations[activeQ.id][optLetter]) {
          setEliminations(prev => ({
            ...prev,
            [activeQ.id]: { ...prev[activeQ.id], [optLetter]: false }
          }));
        }
      };

      const toggleEliminate = (e, optLetter) => {
        e.stopPropagation();
        if (!activeQ) return;
        setEliminations(prev => {
          const qElims = prev[activeQ.id] || {};
          return {
            ...prev,
            [activeQ.id]: {
              ...qElims,
              [optLetter]: !qElims[optLetter]
            }
          };
        });
        // If currently selected, clear selection
        if (answers[activeQ.id] === optLetter) {
          setAnswers(prev => ({ ...prev, [activeQ.id]: "" }));
        }
      };

      const toggleBookmark = () => {
        if (!activeQ) return;
        setBookmarks(prev => ({
          ...prev,
          [activeQ.id]: !prev[activeQ.id]
        }));
      };

      const handleJumpToQuestion = (idx) => {
        recordTimeForActiveQ();
        setCurrentQIndex(idx);
      };

      const handlePause = () => {
        recordTimeForActiveQ();
        setIsPaused(true);
      };

      const handleResume = () => {
        setQEnterTime(Date.now());
        setIsPaused(false);
      };

      // Bluebook Keyboard Shortcuts (A/B/C/D or 1/2/3/4, Arrows, Escape)
      React.useEffect(() => {
        const handleKeyDown = (e) => {
          if (isPaused || isHidden || stage === 'break') return;

          const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
          const isInputFocused = activeTag === 'input' || activeTag === 'textarea';

          if (e.key === 'Escape') {
            if (isReviewOpen) setIsReviewOpen(false);
            if (isCalcOpen) setIsCalcOpen(false);
            if (isRefOpen) setIsRefOpen(false);
            return;
          }

          if (isInputFocused || isReviewOpen || isCalcOpen || isRefOpen) return;

          if (activeQ && activeQ.options) {
            const keyUpper = e.key.toUpperCase();
            if (['A', 'B', 'C', 'D'].includes(keyUpper)) {
              handleAnswerSelect(keyUpper);
              return;
            }
            if (['1', '2', '3', '4'].includes(e.key)) {
              const letterMap = { '1': 'A', '2': 'B', '3': 'C', '4': 'D' };
              handleAnswerSelect(letterMap[e.key]);
              return;
            }
          }

          if (e.key === 'ArrowRight') {
            e.preventDefault();
            handleNext();
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            handlePrev();
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [activeQ, currentQIndex, currentModuleQuestions, answers, isReviewOpen, isCalcOpen, isRefOpen, isPaused, isHidden, stage, handleNext, handlePrev, handleAnswerSelect]);

      const handleAddHighlight = (customColor = highlightColor) => {
        if (!activeQ) return;
        const selected = window.getSelection ? window.getSelection().toString().trim() : '';
        if (selected.length > 1) {
          setHighlights(prev => {
            const list = prev[activeQ.id] || [];
            const exists = list.some(item => (typeof item === 'string' ? item : item.text) === selected);
            if (!exists) {
              return { ...prev, [activeQ.id]: [...list, { text: selected, color: customColor }] };
            }
            return prev;
          });
          if (window.getSelection) window.getSelection().removeAllRanges();
        }
      };

      const handleRemoveSingleHighlight = (phraseIdxOrText) => {
        if (!activeQ) return;
        setHighlights(prev => {
          const list = prev[activeQ.id] || [];
          return {
            ...prev,
            [activeQ.id]: list.filter((item, i) =>
              i !== phraseIdxOrText && (typeof item === 'string' ? item : item.text) !== phraseIdxOrText
            )
          };
        });
      };

      const handleClearHighlights = () => {
        if (!activeQ) return;
        setHighlights(prev => ({ ...prev, [activeQ?.id]: [] }));
      };

      if (stage === 'break') {
        return (
          <SectionBreakScreen
            onResume={() => {
              setStage('math-m1');
              setCurrentQIndex(0);
              setTimeRemaining(35 * 60);
              setQEnterTime(Date.now());
            }}
          />
        );
      }

      const mins = Math.floor(timeRemaining / 60);
      const secs = timeRemaining % 60;
      const formattedTime = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      const elapsedMins = Math.floor(practiceElapsed / 60);
      const elapsedSecs = practiceElapsed % 60;
      const formattedElapsed = `${String(elapsedMins).padStart(2, '0')}:${String(elapsedSecs).padStart(2, '0')}`;

      const answeredCount = currentModuleQuestions.filter(q => answers[q.id] !== undefined && answers[q.id] !== "").length;
      const flaggedCount = currentModuleQuestions.filter(q => bookmarks[q.id]).length;
      const isMath = activeQ?.section === 'math';
      const hasNoteForActiveQ = !!(activeQ && customNotes && customNotes[activeQ.id] && customNotes[activeQ.id].trim());
      const hasDrawingForActiveQ = !!(activeQ && drawings && drawings[activeQ.id] && drawings[activeQ.id].length > 0);

      return (
        <div className="h-full flex flex-col bg-slate-100 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100">
          {/* Proctored / Practice Header */}
          <header className="min-h-14 py-1.5 bg-slate-900 text-white flex flex-wrap items-center justify-between px-4 sm:px-6 border-b border-slate-800 shrink-0 gap-2">
            <div className="flex flex-wrap items-center space-x-2 sm:space-x-3">
              <span className="font-bold tracking-tight text-sm uppercase text-indigo-400">
                Mock Exam {examId}
              </span>
              <span className="text-slate-500">|</span>
              <span className="text-xs sm:text-sm font-medium text-slate-200">
                {stage === 'rw-m1' && "Section 1: Reading & Writing — Module 1"}
                {stage === 'rw-m2' && `Section 1: Reading & Writing — Module 2 (${rwTier === 'hard' ? 'Hard Tier' : 'Standard Tier'})`}
                {stage === 'math-m1' && "Section 2: Math — Module 1"}
                {stage === 'math-m2' && `Section 2: Math — Module 2 (${mathTier === 'hard' ? 'Hard Tier' : 'Standard Tier'})`}
              </span>

              {/* Quick Module Jump Tabs in Practice Mode */}
              {isPracticeMode && (
                <div className="hidden lg:flex items-center space-x-1 bg-slate-800/90 p-0.5 rounded-lg border border-slate-700 ml-2">
                  {[
                    { id: 'rw-m1', label: 'RW M1' },
                    { id: 'rw-m2', label: 'RW M2' },
                    { id: 'math-m1', label: 'Math M1' },
                    { id: 'math-m2', label: 'Math M2' }
                  ].map(mTab => (
                    <button
                      key={mTab.id}
                      onClick={() => {
                        recordTimeForActiveQ();
                        setStage(mTab.id);
                        setCurrentQIndex(0);
                      }}
                      className={`px-2 py-0.5 rounded text-[10px] font-bold transition ${
                        stage === mTab.id
                          ? 'bg-indigo-600 text-white shadow-xs'
                          : 'text-slate-400 hover:text-white'
                      }`}
                      title={`Jump directly to ${mTab.label} (Practice Mode)`}
                    >
                      {mTab.label}
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* Central Practice Mode / Optional Timer Bar */}
            <div className="flex items-center space-x-2">
              <button
                onClick={() => setIsPracticeMode(prev => !prev)}
                className={`px-2.5 py-1 rounded-lg text-xs font-bold border flex items-center space-x-1.5 transition active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none ${
                  isPracticeMode
                    ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300 hover:bg-emerald-500/30'
                    : 'bg-amber-500/20 border-amber-500/50 text-amber-300 hover:bg-amber-500/30'
                }`}
                title="Toggle between Untimed Practice Mode (No Time Limit) and Optional Countdown Timer"
              >
                <span>{isPracticeMode ? '🌱 Practice Mode (Süresiz)' : '⏱️ Timed Mode'}</span>
              </button>

              <div className="flex items-center space-x-2 bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-700">
                <Icon name="Clock" className="w-3.5 h-3.5 text-slate-300" />
                <span className={`font-mono font-bold text-xs sm:text-sm ${!isPracticeMode && timeRemaining < 300 ? 'text-amber-400' : 'text-white'}`}>
                  {isTimerHidden ? "Timer Hidden" : (isPracticeMode ? `∞ (${formattedElapsed})` : formattedTime)}
                </span>
                <button
                  onClick={() => setIsTimerHidden(!isTimerHidden)}
                  className="text-[11px] text-indigo-400 hover:text-indigo-300 ml-1 underline focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none rounded"
                >
                  {isTimerHidden ? "Show" : "Hide"}
                </button>
              </div>

              {!isPracticeMode && (
                <button
                  onClick={handlePause}
                  className="px-2.5 py-1 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
                >
                  Pause
                </button>
              )}
            </div>

            {/* Student & Lesson Tools: Pen, Notepad, Calculator, Reference, Exit */}
            <div className="flex items-center space-x-1.5 sm:space-x-2">
              <button
                onClick={() => setIsDrawOpen(prev => !prev)}
                className={`flex items-center space-x-1 px-2.5 py-1.5 text-xs font-semibold rounded-lg border transition active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none ${
                  isDrawOpen || hasDrawingForActiveQ
                    ? 'bg-indigo-600 text-white border-indigo-500'
                    : 'bg-slate-800 hover:bg-slate-700 text-indigo-300 border-slate-700'
                }`}
                title="Open Pen, Highlighter Brush & Scratchpad (Kalem & Tahta)"
              >
                <Icon name="PenTool" className="w-3.5 h-3.5" />
                <span>Kalem</span>
              </button>

              <button
                onClick={() => setIsNotepadOpen(prev => !prev)}
                className={`flex items-center space-x-1 px-2.5 py-1.5 text-xs font-semibold rounded-lg border transition active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none ${
                  isNotepadOpen || hasNoteForActiveQ
                    ? 'bg-amber-500 text-slate-950 border-amber-400 font-bold'
                    : 'bg-slate-800 hover:bg-slate-700 text-amber-300 border-slate-700'
                }`}
                title="Open Question & Lesson Notepad (Not Defteri)"
              >
                <Icon name="StickyNote" className="w-3.5 h-3.5" />
                <span>Notepad{hasNoteForActiveQ ? ' •' : ''}</span>
              </button>

              {isMath && (
                <>
                  <button
                    onClick={() => setIsCalcOpen(true)}
                    className="flex items-center space-x-1 px-2.5 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-indigo-300 rounded-lg border border-slate-700 transition active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
                  >
                    <Icon name="Calculator" className="w-3.5 h-3.5" />
                    <span className="hidden sm:inline">Calculator</span>
                  </button>
                  <button
                    onClick={() => setIsRefOpen(true)}
                    className="flex items-center space-x-1 px-2.5 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-indigo-300 rounded-lg border border-slate-700 transition active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
                  >
                    <Icon name="Award" className="w-3.5 h-3.5" />
                    <span className="hidden sm:inline">Reference</span>
                  </button>
                </>
              )}
              <button
                onClick={onExitExam}
                className="px-2.5 py-1.5 text-xs font-medium text-slate-400 hover:text-rose-400 rounded-lg transition active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-rose-500 focus-visible:outline-none"
              >
                Exit Test
              </button>
            </div>
          </header>

          {/* 5-Minute Warning Toast */}
          {show5MinAlert && (
            <div className="bg-amber-500 text-slate-950 px-4 py-2 text-center text-sm font-bold flex items-center justify-center space-x-2 shadow">
              <Icon name="AlertTriangle" className="w-4 h-4" />
              <span>5 minutes remaining in this module! Double-check all unanswered and flagged questions.</span>
            </div>
          )}

          {/* Split-Screen Workspace */}
          <div className="flex-1 flex overflow-hidden">
            {/* Left Pane: Stimulus / Passage (if present) */}

          {/* Friendly Coach Brief Banner */}
          <div className="mb-4 p-3.5 rounded-xl bg-gradient-to-r from-indigo-50/80 via-purple-50/40 to-slate-50 dark:from-indigo-950/40 dark:via-purple-950/20 dark:to-zinc-900 border border-indigo-100 dark:border-indigo-900/40 flex items-start space-x-3.5 shadow-xs">
            <div className="w-8 h-8 rounded-xl bg-indigo-600/10 dark:bg-indigo-400/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shrink-0 mt-0.5 text-base">
              🎓
            </div>
            <div className="text-xs">
              <div className="font-bold text-slate-800 dark:text-zinc-200 mb-0.5">Instructor's Strategy Brief</div>
              <p className="text-slate-600 dark:text-zinc-400 leading-relaxed">
                Every question type on the Digital SAT follows a predictable cognitive blueprint. Master the rules, watch for the trap archetypes, and apply the 3-step algorithm to build effortless test-day muscle memory!
              </p>
            </div>
          </div>

          {/* Domain Header Card */}
          <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl p-5 mb-4 shadow-sm">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wider bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300">
                    {meta?.section === 'reading-writing' ? 'Reading & Writing' : 'Math'}
                  </span>
                  <span className="text-xs text-slate-500 font-medium">{meta?.frequency}</span>
                </div>
                <h1 className="text-2xl font-extrabold text-slate-900 dark:text-white mt-1">{domainData.name}</h1>
                <p className="text-sm text-slate-600 dark:text-zinc-400 mt-1 max-w-2xl">{meta?.description}</p>
              </div>

              <button
                onClick={() => onNavigateToDrills(selectedDomain)}
                className="px-4 py-2 sm:px-5 sm:py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold text-xs shadow flex items-center space-x-1.5 self-start sm:self-auto transition shrink-0 active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
              >
                <Icon name="Zap" className="w-4 h-4" />
                <span>Practice Question Drills</span>
              </button>
            </div>

            {/* 4-Part Module Navigation Tabs */}
            <div className="flex items-center space-x-2 border-b border-slate-200 dark:border-zinc-800 mt-5 -mb-5 pb-0 overflow-x-auto">
              {[
                { id: 'mechanics', label: '1. The Mechanics', icon: 'BookOpen' },
                { id: 'traps', label: '2. Trap Archetypes', icon: 'AlertTriangle' },
                { id: 'algorithm', label: '3. Step-by-Step Algorithm', icon: 'Layers' },
                { id: 'walkthroughs', label: '4. Guided Walkthroughs (2 Items)', icon: 'Edit3' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex items-center space-x-2 px-4 py-2.5 text-xs font-bold border-b-2 transition whitespace-nowrap focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none ${
                    activeTab === tab.id
                      ? 'border-indigo-600 text-indigo-600 dark:text-indigo-400'
                      : 'border-transparent text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-200'
                  }`}
                >
                  <Icon name={tab.icon} className="w-4 h-4" />
                  <span>{tab.label}</span>
                </button>
              ))}
            </div>
          </div>

          {/* Tab Content */}
          <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl p-5 sm:p-6 shadow-sm">
            {/* 1. The Mechanics */}
            {activeTab === 'mechanics' && (
              <div className="space-y-6">
                <div>
                  <h3 className="text-base font-bold text-slate-900 dark:text-white mb-2">Core Domain Rules & Principles</h3>
                  <div className="p-4 bg-slate-50 dark:bg-zinc-800/50 rounded-xl border border-slate-200 dark:border-zinc-700/60 text-sm text-slate-700 dark:text-zinc-300 leading-relaxed">
                    <MathRenderer content={domainData.mechanics.coreRules} />
                  </div>
                </div>

                <div>
                  <h3 className="text-base font-bold text-slate-900 dark:text-white mb-2">Question Stem Anatomy</h3>
                  <div className="p-4 bg-indigo-50/50 dark:bg-indigo-950/20 rounded-xl border border-indigo-100 dark:border-indigo-900/40 text-sm text-slate-800 dark:text-zinc-200 font-mono whitespace-pre-line leading-relaxed">
                    <MathRenderer content={domainData.mechanics.stemAnatomy} />
                  </div>
                </div>

                <div>
                  <h3 className="text-base font-bold text-slate-900 dark:text-white mb-2">Test Frequency & Scoring Weight</h3>
                  <div className="p-4 bg-slate-50 dark:bg-zinc-800/50 rounded-xl border border-slate-200 dark:border-zinc-700/60 text-sm text-slate-700 dark:text-zinc-300">
                    <MathRenderer content={domainData.mechanics.testFrequency} />
                  </div>
                </div>
              </div>
            )}

            {/* 2. Trap Archetypes */}
            {activeTab === 'traps' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {domainData.traps.map((trap, idx) => (
                  <div key={idx} className="p-5 bg-slate-50 dark:bg-zinc-800/60 rounded-xl border border-slate-200 dark:border-zinc-700/60 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center space-x-2 text-rose-600 dark:text-rose-400 font-bold text-sm mb-2">
                        <Icon name="AlertTriangle" className="w-4 h-4" />
                        <span><MathRenderer content={trap.name} /></span>
                      </div>
                      <p className="text-xs text-slate-600 dark:text-zinc-300 leading-relaxed mb-4">
                        <MathRenderer content={trap.description} />
                      </p>
                    </div>
                    <div className="pt-3 border-t border-slate-200 dark:border-zinc-700 text-xs font-medium text-indigo-600 dark:text-indigo-400 flex items-center space-x-1">
                      <span className="font-bold">Detection Cue:</span>
                      <span className="text-slate-600 dark:text-zinc-400"><MathRenderer content={trap.detectionCue} /></span>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* 3. Step-by-Step Algorithm */}
            {activeTab === 'algorithm' && (
              <div className="space-y-4">
                {domainData.algorithm.map((stepStr, sIdx) => (
                  <div key={sIdx} className="p-5 bg-slate-50 dark:bg-zinc-800/50 rounded-xl border border-slate-200 dark:border-zinc-700/60 flex items-start space-x-4">
                    <div className="w-8 h-8 rounded-full bg-indigo-600 text-white font-bold text-sm flex items-center justify-center shrink-0">
                      {sIdx + 1}
                    </div>
                    <div className="text-sm text-slate-800 dark:text-zinc-200 leading-relaxed pt-1">
                      <MathRenderer content={stepStr} />
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* 4. Guided Walkthroughs */}
            {activeTab === 'walkthroughs' && (
              <div className="space-y-8">
                {domainData.walkthroughs.map((wItem, wIdx) => {
                  const userChoice = userSelections[wItem.id];
                  return (
                    <div key={wItem.id} className="border border-slate-200 dark:border-zinc-800 rounded-xl p-6 bg-slate-50/50 dark:bg-zinc-950/40">
                      <div className="flex items-center justify-between mb-4">
                        <span className="px-2.5 py-1 bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 rounded-lg text-xs font-bold uppercase tracking-wide">
                          Sample Item {wIdx + 1}: {wItem.title}
                        </span>
                        <span className="text-xs text-slate-500">Interactive Walkthrough</span>
                      </div>

                      {wItem.passage && (
                        <div className="p-4 bg-white dark:bg-zinc-900 rounded-xl border border-slate-200 dark:border-zinc-800 text-sm font-serif leading-relaxed text-slate-800 dark:text-zinc-200 mb-4 whitespace-pre-line">
                          {wItem.passage}
                        </div>
                      )}

                      <div className="text-sm font-medium text-slate-900 dark:text-white mb-4">
                        <MathRenderer content={wItem.stem} />
                      </div>

                      {/* Options */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-6">
                        {wItem.options.map((opt, oIdx) => {
                          const letter = ['A', 'B', 'C', 'D'][oIdx];
                          const isSelected = userChoice === letter;
                          const isCorrect = letter === wItem.correctAnswer;

                          return (
                            <button
                              key={letter}
                              onClick={() => setUserSelections(prev => ({ ...prev, [wItem.id]: letter }))}
                              className={`p-3 rounded-xl border text-left text-xs font-medium transition flex items-center space-x-2 ${
                                isSelected
                                  ? isCorrect
                                    ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-200 font-bold'
                                    : 'border-rose-500 bg-rose-50 dark:bg-rose-950/40 text-rose-800 dark:text-rose-200'
                                  : 'border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 hover:border-indigo-400 text-slate-700 dark:text-zinc-300'
                              }`}
                            >
                              <span className="w-6 h-6 rounded-full bg-slate-100 dark:bg-zinc-800 flex items-center justify-center font-bold text-[11px] shrink-0">
                                {letter}
                              </span>
                              <span className="flex-1">
                                <MathRenderer content={opt.replace(/^[A-D]\)\s*/, '')} />
                              </span>
                            </button>
                          );
                        })}
                      </div>

                      {/* Toggleable Step-by-Step Rationales */}
                      <div className="border-t border-slate-200 dark:border-zinc-800 pt-4">
                        <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-zinc-400 mb-3">
                          Step-by-Step Cognitive Rationale (Toggle to inspect thinking)
                        </h4>

                        <div className="space-y-2 mb-4">
                          {wItem.stepRationales.map((stepText, sIdx) => {
                            const isStepOpen = walkthroughStepsOpen[`${wItem.id}-${sIdx}`] !== false; // default open
                            return (
                              <div key={sIdx} className="border border-slate-200 dark:border-zinc-800 rounded-xl overflow-hidden bg-white dark:bg-zinc-900">
                                <button
                                  onClick={() => toggleStep(wItem.id, sIdx)}
                                  className="w-full px-4 py-2.5 text-left text-xs font-bold text-indigo-600 dark:text-indigo-400 hover:bg-slate-50 dark:hover:bg-zinc-800/50 flex items-center justify-between"
                                >
                                  <span>Step {sIdx + 1} Analysis</span>
                                  <Icon name={isStepOpen ? 'ChevronUp' : 'ChevronDown'} className="w-4 h-4 text-slate-400" />
                                </button>
                                {isStepOpen && (
                                  <div className="px-4 pb-3 text-xs text-slate-700 dark:text-zinc-300 leading-relaxed border-t border-slate-100 dark:border-zinc-800/60 pt-2">
                                    <MathRenderer content={stepText} />
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>

                        {/* Trap Analysis Cards */}
                        {wItem.trapAnalysis && (
                          <div className="p-4 bg-amber-500/10 border border-amber-500/20 rounded-xl text-xs">
                            <span className="font-bold text-amber-600 dark:text-amber-400 block mb-2">
                              Distractor Trap Breakdown:
                            </span>
                            <div className="space-y-1.5 text-slate-700 dark:text-zinc-300">
                              {Object.entries(wItem.trapAnalysis).map(([optKey, trapExp]) => (
                                <div key={optKey}>
                                  <strong className="text-slate-900 dark:text-white">Option {optKey}:</strong> <MathRenderer content={trapExp} />
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 15. QUESTION-TYPE DRILLS VIEW
    // ==========================================
    function DrillsView({ initialDomainId, onRecordDrill, externalAnswers, setExternalAnswers, externalSubmitted, setExternalSubmitted }) {
      const [domainFilter, setDomainFilter] = React.useState(initialDomainId || 'all');
      const [typeFilter, setTypeFilter] = React.useState('all');
      const [difficultyFilter, setDifficultyFilter] = React.useState('all');

      const [localAnswers, setLocalAnswers] = React.useState({});
      const [localSubmitted, setLocalSubmitted] = React.useState({});
      const [drillHighlights, setDrillHighlights] = React.useState({});
      const [activeHighlightColor, setActiveHighlightColor] = React.useState('yellow');

      const selectedAnswers = externalAnswers || localAnswers;
      const setSelectedAnswers = setExternalAnswers || setLocalAnswers;
      const submitted = externalSubmitted || localSubmitted;
      const setSubmitted = setExternalSubmitted || setLocalSubmitted;

      const handleDrillHighlight = (drillId, colorOverride) => {
        const sel = window.getSelection();
        if (!sel) return;
        const text = sel.toString().trim();
        if (text.length < 2) return;
        const chosenColor = colorOverride || activeHighlightColor || 'yellow';
        setDrillHighlights(prev => {
          const curr = prev[drillId] || [];
          const filtered = curr.filter(item => (typeof item === 'string' ? item : item.text) !== text);
          return {
            ...prev,
            [drillId]: [...filtered, { text, color: chosenColor }]
          };
        });
        sel.removeAllRanges();
      };

      const handleRemoveDrillHighlight = (drillId, phraseIdxOrText) => {
        setDrillHighlights(prev => ({
          ...prev,
          [drillId]: (prev[drillId] || []).filter((item, idx) =>
            idx !== phraseIdxOrText && (typeof item === 'string' ? item : item.text) !== phraseIdxOrText
          )
        }));
      };

      // Filtered Drills Pool
      const filteredDrills = React.useMemo(() => {
        return DRILL_ITEMS.filter(item => {
          if (domainFilter !== 'all' && item.domain !== domainFilter) return false;
          if (typeFilter !== 'all' && item.questionType !== typeFilter) return false;
          if (difficultyFilter !== 'all' && item.difficulty !== difficultyFilter) return false;
          return true;
        });
      }, [domainFilter, typeFilter, difficultyFilter]);

      const handleCheckAnswer = (drillId, targetAnswer) => {
        setSubmitted(prev => ({ ...prev, [drillId]: true }));
        const isCorr = selectedAnswers[drillId] === targetAnswer;
        if (onRecordDrill) {
          const item = DRILL_ITEMS.find(d => d.id === drillId);
          onRecordDrill({
            id: `drill-res-${Date.now()}`,
            domain: item?.domain || 'algebra',
            questionType: item?.questionType || 'linear-equations',
            total: 1,
            correct: isCorr ? 1 : 0,
            date: new Date().toISOString()
          });
        }
      };

      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-6 py-5 sm:py-6">
          <div className="mb-4">
            <div className="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200/60 dark:border-indigo-800/40 text-indigo-700 dark:text-indigo-300 text-xs font-semibold mb-2">
              <span>🎯 Targeted Skill Building</span>
              <span>•</span>
              <span>Instant Feedback & Multi-Color Highlighter</span>
            </div>
            <h1 className="text-2xl font-extrabold text-slate-900 dark:text-white">Question-Type Practice Drills</h1>
            <p className="text-sm text-slate-600 dark:text-zinc-400 mt-1">
              Practice at your own pace with low stakes and immediate mentor rationales. Select any text in a passage to highlight key evidence or use the top Kalem & Notepad tools!
            </p>
          </div>

          {/* Filter Bar */}
          <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl p-3 mb-4 shadow-sm flex flex-wrap gap-2.5 items-center">
            <div className="flex items-center space-x-2 text-xs font-bold text-slate-500 uppercase">
              <Icon name="Filter" className="w-4 h-4 text-indigo-500" />
              <span>Filters:</span>
            </div>

            {/* Domain Dropdown */}
            <select
              value={domainFilter}
              onChange={(e) => {
                setDomainFilter(e.target.value);
                setTypeFilter('all');
              }}
              className="px-3 py-1.5 bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl text-xs font-medium text-slate-800 dark:text-zinc-200 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
            >
              <option value="all">All Domains (8)</option>
              {DOMAINS.map(d => (
                <option key={d.id} value={d.id}>{d.name}</option>
              ))}
            </select>

            {/* Difficulty Dropdown */}
            <select
              value={difficultyFilter}
              onChange={(e) => setDifficultyFilter(e.target.value)}
              className="px-3 py-1.5 bg-slate-50 dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl text-xs font-medium text-slate-800 dark:text-zinc-200 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
            >
              <option value="all">All Difficulties</option>
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
            </select>

            {/* Drill Highlighter Color Picker */}
            <div className="flex items-center space-x-1.5 bg-slate-50 dark:bg-zinc-800 px-2.5 py-1 rounded-xl border border-slate-200 dark:border-zinc-700 text-xs">
              <Icon name="Highlighter" className="w-3.5 h-3.5 text-amber-500" />
              <span className="text-[11px] font-semibold text-slate-600 dark:text-zinc-300">Auto-Highlight:</span>
              {HIGHLIGHT_COLORS.map(hc => (
                <button
                  key={hc.id}
                  onClick={() => setActiveHighlightColor(hc.id)}
                  title={hc.label}
                  className={`w-4 h-4 rounded-full ${hc.swatch} transition ${
                    activeHighlightColor === hc.id ? 'ring-2 ring-indigo-600 scale-110' : 'opacity-70 hover:opacity-100'
                  }`}
                />
              ))}
            </div>

            <span className="text-xs text-slate-500 ml-auto font-medium">
              Showing {filteredDrills.length} items
            </span>
          </div>

          {/* Drills List */}
          <div className="space-y-4">
            {filteredDrills.map((drill, idx) => {
              const isChecked = submitted[drill.id];
              const userAns = selectedAnswers[drill.id];
              const isCorrect = userAns === drill.correctAnswer;

              return (
                <div key={drill.id} className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl p-5 shadow-xs mb-4">
                  <div className="flex items-center justify-between mb-3 text-xs">
                    <span className="font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">
                      Drill #{idx + 1} • {drill.questionType.replace(/-/g, ' ')}
                    </span>
                    <div className="flex items-center space-x-2">
                      {(drillHighlights[drill.id] || []).length > 0 && (
                        <button
                          onClick={() => setDrillHighlights(prev => ({ ...prev, [drill.id]: [] }))}
                          className="text-[11px] text-slate-400 hover:text-rose-500 transition"
                        >
                          Clear Highlights
                        </button>
                      )}
                      <span className={`px-2 py-0.5 rounded-full font-bold uppercase text-[10px] ${
                        drill.difficulty === 'hard' ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300' :
                        drill.difficulty === 'medium' ? 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300' :
                        'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'
                      }`}>
                        {drill.difficulty}
                      </span>
                    </div>
                  </div>

                  {drill.passage && (
                    <div
                      onMouseUp={() => handleDrillHighlight(drill.id, activeHighlightColor)}
                      className="p-3.5 bg-slate-50 dark:bg-zinc-950 rounded-xl border border-slate-200 dark:border-zinc-800 text-sm font-serif leading-relaxed text-slate-800 dark:text-zinc-200 mb-3.5 whitespace-pre-line select-text"
                      title="Select any text with your mouse to highlight it!"
                    >
                      {renderPassageWithHighlights(
                        drill.passage,
                        drillHighlights[drill.id] || [],
                        (phrase) => handleRemoveDrillHighlight(drill.id, phrase)
                      )}
                    </div>
                  )}

                  <div className="text-sm font-medium text-slate-900 dark:text-white mb-3.5">
                    <MathRenderer content={drill.stem} />
                  </div>

                  {/* Multiple Choice Options */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4" role="radiogroup" aria-label="Drill options">
                    {drill.options.map((opt, oIdx) => {
                      const letter = ['A', 'B', 'C', 'D'][oIdx];
                      const isSelected = userAns === letter;

                      return (
                        <button
                          key={letter}
                          role="radio"
                          aria-checked={isSelected}
                          disabled={isChecked}
                          onClick={() => setSelectedAnswers(prev => ({ ...prev, [drill.id]: letter }))}
                          className={`p-3 rounded-xl border text-left text-xs font-medium transition flex items-center space-x-2 active:scale-[0.99] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none ${
                            isChecked
                              ? letter === drill.correctAnswer
                                ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-200 font-bold'
                                : isSelected
                                ? 'border-rose-500 bg-rose-50 dark:bg-rose-950/40 text-rose-800 dark:text-rose-200'
                                : 'border-slate-200 dark:border-zinc-800 opacity-50'
                              : isSelected
                              ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-900 dark:text-indigo-100 font-semibold shadow-xs'
                              : 'border-slate-200 dark:border-zinc-800 hover:border-indigo-400 text-slate-700 dark:text-zinc-300'
                          }`}
                        >
                          <span className="w-6 h-6 rounded-full bg-slate-100 dark:bg-zinc-800 flex items-center justify-center font-bold text-[11px] shrink-0">
                            {letter}
                          </span>
                          <span className="flex-1">
                            <MathRenderer content={opt.replace(/^[A-D]\)\s*/, '')} />
                          </span>
                        </button>
                      );
                    })}
                  </div>

                  {!isChecked ? (
                    <button
                      onClick={() => handleCheckAnswer(drill.id, drill.correctAnswer)}
                      disabled={!userAns}
                      className="px-4 py-2 sm:px-5 sm:py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded-xl font-semibold text-xs shadow-sm transition active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
                    >
                      Check Answer
                    </button>
                  ) : (
                    <div className={`mt-3.5 p-4 rounded-xl border text-xs leading-relaxed ${
                      isCorrect
                        ? 'bg-emerald-50/50 dark:bg-emerald-950/20 border-emerald-200 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200'
                        : 'bg-rose-50/50 dark:bg-rose-950/20 border-rose-200 dark:border-rose-800 text-rose-900 dark:text-rose-200'
                    }`}>
                      <div className="font-bold flex items-center space-x-1 mb-1">
                        <Icon name={isCorrect ? 'CheckCircle' : 'XCircle'} className="w-4 h-4" />
                        <span>{isCorrect ? 'Correct!' : `Incorrect (Correct: Option ${drill.correctAnswer})`}</span>
                      </div>
                      <div className="mt-1 text-slate-700 dark:text-zinc-300">
                        <MathRenderer content={drill.explanation} />
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );

    function SettingsView({ state, toggleTheme, exportStateJson, importStateJson, resetAllData }) {

        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const content = event.target?.result;
          if (typeof content === 'string') {
            const res = importStateJson(content);
            setImportStatus(res);
            setTimeout(() => setImportStatus(null), 5000);
          }
        };
        reader.readAsText(file);
      };

      const handleConfirmReset = () => {
        if (resetConfirmText === 'RESET') {
          resetAllData();
          setShowResetModal(false);
          setResetConfirmText("");

    // ==========================================
    // 16. APPLICATION ERROR BOUNDARY
    // ==========================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught an unhandled rendering error:", error, errorInfo);
        this.setState({ errorInfo });
      }

      handleReset = () => {
        this.setState({ hasError: false, error: null, errorInfo: null });
        window.location.reload();
      };

      handleClearDataAndReload = () => {
        try {
          localStorage.removeItem("DIGITAL_SAT_APP_STATE_V1");
        } catch (e) {
          console.warn("Could not clear localStorage:", e);
        }
        window.location.reload();
      };

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-6">
              <div className="max-w-lg w-full bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl text-center">
                <div className="w-16 h-16 bg-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center mx-auto mb-6">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                  </svg>
                </div>
                <h2 className="text-2xl font-bold mb-3 text-white">Something went wrong</h2>
                <p className="text-sm text-slate-300 mb-6 leading-relaxed">
                  An unexpected rendering error occurred in the Digital SAT testing platform. Your progress is saved in local storage.
                </p>
                {this.state.error && (
                  <pre className="text-xs bg-slate-950 text-rose-300 p-4 rounded-xl text-left overflow-x-auto mb-6 max-h-32 font-mono border border-slate-700">
                    {this.state.error.toString()}
                  </pre>
                )}
                <div className="flex flex-col sm:flex-row gap-3 justify-center">
                  <button
                    onClick={this.handleReset}
                    className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-indigo-600/30"
                  >
                    Reload Application
                  </button>
                  <button
                    onClick={this.handleClearDataAndReload}
                    className="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded-xl text-sm transition"
                  >
                    Reset Storage & Reload
                  </button>
                </div>
              </div>
            </div>
          );
        }

        return this.props.children;
      }
    }

    // Export core modules for Node and browser test runners
    if (typeof window !== 'undefined') {
      window.MOCK_1_DATA = MOCK_1_DATA;
      window.CURRICULUM_DATA = CURRICULUM_DATA;
      window.DRILL_ITEMS = DRILL_ITEMS;
      window.DOMAINS = DOMAINS;
      window.QUESTION_TYPES = QUESTION_TYPES;
      window.QUESTION_TYPE_TO_LESSON_MAP = QUESTION_TYPE_TO_LESSON_MAP;
      window.evaluateGridIn = evaluateGridIn;
      window.calculateScaledScore = calculateScaledScore;
      window.calculateCompositeScore = calculateCompositeScore;
      window.ExamScaffoldEngine = ExamScaffoldEngine;
      window.ErrorBoundary = ErrorBoundary;
    }

    if (typeof module !== 'undefined' && module.exports) {
      module.exports = {
        MOCK_1_DATA,
        CURRICULUM_DATA,
        DRILL_ITEMS,
        DOMAINS,
        QUESTION_TYPES,
        QUESTION_TYPE_TO_LESSON_MAP,
        evaluateGridIn,
        calculateScaledScore,
        calculateCompositeScore,
        ExamScaffoldEngine,
        ErrorBoundary
      };
    }

    // Mount React App
    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
