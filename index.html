    const LATEX_SYMBOL_MAP = {

    const LATEX_ROMAN_FUNCS = new Set(['sin', 'cos', 'tan', 'cot', 'sec', 'csc', 'log', 'ln', 'max', 'min']);

    function extractBracedGroup(str, startIdx) {
      if (startIdx >= str.length || str[startIdx] !== '{') return null;
      let depth = 0;
      let i = startIdx;
      while (i < str.length) {
        if (str[i] === '\\') {
          i += 2;
          continue;
        }
        if (str[i] === '{') depth++;
        else if (str[i] === '}') {
          depth--;
          if (depth === 0) {
            return { content: str.slice(startIdx + 1, i), nextIdx: i + 1 };
          }
        }
        i++;
      }
      return { content: str.slice(startIdx + 1), nextIdx: str.length };
    }

    function extractBracketGroup(str, startIdx) {
      if (startIdx >= str.length || str[startIdx] !== '[') return null;
      let depth = 0;
      let i = startIdx;
      while (i < str.length) {
        if (str[i] === '[') depth++;
        else if (str[i] === ']') {
          depth--;
          if (depth === 0) {
            return { content: str.slice(startIdx + 1, i), nextIdx: i + 1 };
          }
        }
        i++;
      }
      return null;
    }

    function buildLatexFallbackDOM(tex, parentEl) {
      if (!tex) return;
      let s = tex.trim();

      // Handle \begin{cases} ... \end{cases}
      const casesMatch = s.match(/^\\begin\{cases\}([\s\S]*?)\\end\{cases\}$/);
      if (casesMatch) {
        const box = document.createElement('span');
        box.className = 'math-fallback-cases';
        const inner = document.createElement('span');
        const rows = casesMatch[1].split(/\\\\/).map(r => r.trim()).filter(Boolean);
        rows.forEach((r, idx) => {
          const rowEl = document.createElement('div');
          buildLatexFallbackDOM(r.replace(/&/g, ' '), rowEl);
          inner.appendChild(rowEl);
        });
        box.appendChild(inner);
        parentEl.appendChild(box);
        return;
      }

      // Handle \begin{aligned} ... \end{aligned}
      const alignedMatch = s.match(/^\\begin\{aligned\}([\s\S]*?)\\end\{aligned\}$/);
      if (alignedMatch) {
        const box = document.createElement('span');
        box.style.display = 'inline-block';
        box.style.textAlign = 'left';
        box.style.verticalAlign = 'middle';
        const rows = alignedMatch[1].split(/\\\\/).map(r => r.trim()).filter(Boolean);
        rows.forEach(r => {
          const rowEl = document.createElement('div');
          buildLatexFallbackDOM(r.replace(/&/g, ''), rowEl);
          box.appendChild(rowEl);
        });
        parentEl.appendChild(box);
        return;
      }

      // Handle \begin{array}{...} ... \end{array}
      const arrayMatch = s.match(/^\\begin\{array\}\{[^}]*\}([\s\S]*?)\\end\{array\}$/);
      if (arrayMatch) {
        const table = document.createElement('table');
        table.className = 'math-fallback-table';
        const tbody = document.createElement('tbody');
        const rows = arrayMatch[1].split(/\\\\/).map(r => r.replace(/\\hline/g, '').trim()).filter(Boolean);
        rows.forEach(r => {
          const tr = document.createElement('tr');
          const cells = r.split('&');
          cells.forEach(c => {
            const td = document.createElement('td');
            buildLatexFallbackDOM(c.trim(), td);
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        parentEl.appendChild(table);
        return;
      }

      let i = 0;
      let textBuf = '';
      const flushText = () => {
        if (textBuf) {
          parentEl.appendChild(document.createTextNode(textBuf));
          textBuf = '';
        }
      };

      while (i < s.length) {
        const ch = s[i];

        if (ch === '\\') {
          if (i + 1 < s.length && !/[a-zA-Z]/.test(s[i + 1])) {
            const esc = s[i + 1];
            if (esc === '{' || esc === '}' || esc === '%' || esc === '$' || esc === '&' || esc === '#') {
              textBuf += esc;
            } else if (esc === ',' || esc === ';' || esc === ':') {
              textBuf += '\u2009';
            }
            i += 2;
            continue;
          }
          let j = i + 1;
          while (j < s.length && /[a-zA-Z]/.test(s[j])) j++;
          const cmd = s.slice(i + 1, j);
          i = j;

          if (cmd === 'left' || cmd === 'right') {
            continue;
          } else if (cmd === 'sqrt') {
            flushText();
            while (i < s.length && s[i] === ' ') i++;
            let rootIdxStr = null;
            if (s[i] === '[') {
              const brk = extractBracketGroup(s, i);
              if (brk) {
                rootIdxStr = brk.content;
                i = brk.nextIdx;
              }
            }
            while (i < s.length && s[i] === ' ') i++;
            let radicandStr = '';
            if (s[i] === '{') {
              const grp = extractBracedGroup(s, i);
              if (grp) {
                radicandStr = grp.content;
                i = grp.nextIdx;
              }
            } else if (i < s.length) {
              radicandStr = s[i];
              i++;
            }
            const sqrtWrap = document.createElement('span');
            sqrtWrap.className = 'math-fallback-sqrt';
            if (rootIdxStr) {
              const supIdx = document.createElement('sup');
              supIdx.className = 'math-fallback-root-idx';
              buildLatexFallbackDOM(rootIdxStr, supIdx);
              sqrtWrap.appendChild(supIdx);
            }
            const surd = document.createElement('span');
            surd.className = 'math-fallback-surd';
            surd.textContent = '√';
            sqrtWrap.appendChild(surd);

            const radSpan = document.createElement('span');
            radSpan.className = 'math-fallback-radicand';
            buildLatexFallbackDOM(radicandStr, radSpan);
            sqrtWrap.appendChild(radSpan);
            parentEl.appendChild(sqrtWrap);
          } else if (cmd === 'frac' || cmd === 'dfrac' || cmd === 'tfrac') {
            flushText();
            while (i < s.length && s[i] === ' ') i++;
            const numGrp = extractBracedGroup(s, i);
            let numStr = '';
            if (numGrp) {
              numStr = numGrp.content;
              i = numGrp.nextIdx;
            }
            while (i < s.length && s[i] === ' ') i++;
            const denGrp = extractBracedGroup(s, i);
            let denStr = '';
            if (denGrp) {
              denStr = denGrp.content;
              i = denGrp.nextIdx;
            }
            const fracWrap = document.createElement('span');
            fracWrap.className = 'math-fallback-frac';
            const numSpan = document.createElement('span');
            numSpan.className = 'math-fallback-num';
            buildLatexFallbackDOM(numStr, numSpan);
            const denSpan = document.createElement('span');
            denSpan.className = 'math-fallback-den';
            buildLatexFallbackDOM(denStr, denSpan);
            fracWrap.appendChild(numSpan);
            fracWrap.appendChild(denSpan);
            parentEl.appendChild(fracWrap);
          } else if (cmd === 'text' || cmd === 'mathrm' || cmd === 'textbf') {
            flushText();
            while (i < s.length && s[i] === ' ') i++;
            const txtGrp = extractBracedGroup(s, i);
            if (txtGrp) {
              const span = document.createElement('span');
              span.className = 'math-fallback-roman';

              parentEl.appendChild(span);
              i = txtGrp.nextIdx;

            flushText();
            const fnSpan = document.createElement('span');
            fnSpan.className = 'math-fallback-roman';
            fnSpan.textContent = cmd;
            parentEl.appendChild(fnSpan);
          } else if (LATEX_SYMBOL_MAP[cmd] !== undefined) {
            textBuf += LATEX_SYMBOL_MAP[cmd];
            if (i < s.length && s[i] === ' ') i++;
          } else {
            textBuf += cmd;
          }
        } else if (ch === '^' || ch === '_') {
          flushText();
          const isSup = ch === '^';
          i++;
          while (i < s.length && s[i] === ' ') i++;
          let scriptStr = '';
          if (s[i] === '{') {
            const grp = extractBracedGroup(s, i);
            if (grp) {
              scriptStr = grp.content;
              i = grp.nextIdx;
            }
          } else if (s[i] === '\\') {
            let j = i + 1;
            while (j < s.length && /[a-zA-Z]/.test(s[j])) j++;
            scriptStr = s.slice(i, j);
            i = j;
          } else if (i < s.length) {
            scriptStr = s[i];
            i++;
          }
          if (isSup && (scriptStr.trim() === '\\circ' || scriptStr.trim() === 'circ')) {
            textBuf += '°';
          } else {
            const el = document.createElement(isSup ? 'sup' : 'sub');
            buildLatexFallbackDOM(scriptStr, el);
            parentEl.appendChild(el);
          }
        } else if (ch === '{') {
          flushText();
          const grp = extractBracedGroup(s, i);
          if (grp) {
            buildLatexFallbackDOM(grp.content, parentEl);
            i = grp.nextIdx;
          } else {
            i++;
          }
        } else {
          textBuf += ch;
          i++;
        }
      }
      flushText();
    }

    function appendPlainTextWithBoldDOM(textStr, parentEl) {
      if (!textStr) return;
      if (!textStr.includes('**')) {
        parentEl.appendChild(document.createTextNode(textStr));
        return;
      }
      const parts = textStr.split(/\*\*([^*]+)\*\*/g);
      parts.forEach((part, idx) => {
        if (!part) return;
        if (idx % 2 === 1) {
          const strong = document.createElement('strong');
          strong.className = 'font-semibold text-slate-900 dark:text-white';
          strong.textContent = part;
          parentEl.appendChild(strong);
        } else {
          parentEl.appendChild(document.createTextNode(part));
        }
      });
    }

    function applyBoldToTextNodes(rootEl) {
      if (!rootEl) return;
      const childNodes = Array.from(rootEl.childNodes);
      childNodes.forEach(node => {
        if (node.nodeType === 3 && node.nodeValue && node.nodeValue.includes('**')) {
          const frag = document.createDocumentFragment();
          appendPlainTextWithBoldDOM(node.nodeValue, frag);
          rootEl.replaceChild(frag, node);
        }
      });
    }

    function renderNativeMathFallback(containerEl, rawContent) {
      while (containerEl.firstChild) {
        containerEl.removeChild(containerEl.firstChild);
      }
      const str = String(rawContent);
      const tokenRegex = /(\$\$[\s\S]+?\$\$|\$(?:\\\$|[^$])+?\$)/g;
      let lastIndex = 0;
      let match;
      while ((match = tokenRegex.exec(str)) !== null) {
        if (match.index > lastIndex) {
          appendPlainTextWithBoldDOM(str.slice(lastIndex, match.index), containerEl);
        }
        const token = match[0];
        const isDisplay = token.startsWith('$$') && token.endsWith('$$');
        const innerTex = isDisplay ? token.slice(2, -2) : token.slice(1, -1);
        if (window.katex && typeof window.katex.render === 'function') {
          const span = document.createElement(isDisplay ? 'div' : 'span');
          try {
            window.katex.render(innerTex, span, { displayMode: isDisplay, throwOnError: false });
            containerEl.appendChild(span);
            lastIndex = tokenRegex.lastIndex;
            continue;
          } catch (e) {}
        }
        const mathSpan = document.createElement(isDisplay ? 'div' : 'span');
        mathSpan.className = isDisplay ? 'math-fallback-display' : 'math-fallback-inline';
        buildLatexFallbackDOM(innerTex, mathSpan);
        containerEl.appendChild(mathSpan);
        lastIndex = tokenRegex.lastIndex;
      }
      if (lastIndex < str.length) {
        appendPlainTextWithBoldDOM(str.slice(lastIndex), containerEl);
      }
    }

    function MathRenderer({ content, className = '' }) {
      if (!content) return null;
      const ref = React.useRef(null);

      React.useEffect(() => {
        const el = ref.current;
        if (!el) return;

        const performRender = () => {
          if (!ref.current) return;
          if (window.renderMathInElement) {
            try {
              ref.current.textContent = content;
              window.renderMathInElement(ref.current, {
                delimiters: [
                  { left: '$$', right: '$$', display: true },
                  { left: '$', right: '$', display: false },
                  { left: '\\[', right: '\\]', display: true },
                  { left: '\\(', right: '\\)', display: false }
                ],
                throwOnError: false,
                errorColor: '#f43f5e'
              });
              if (String(content).includes('**')) {
                applyBoldToTextNodes(ref.current);
              }
              return true;
            } catch (e) {
              console.warn('KaTeX render error, using native DOM math fallback:', e);
            }
          }
          renderNativeMathFallback(ref.current, content);
          return false;
        };

        const renderedWithKatex = performRender();
        if (!renderedWithKatex) {
          const handleLoad = () => { performRender(); };
          window.addEventListener('load', handleLoad, { once: true });
          return () => window.removeEventListener('load', handleLoad);
        }
      }, [content]);

      return (
        <span ref={ref} className={`math-rendered-content ${className}`} />
      );
    }

    // Safe phrase-based text highlighter that preserves React virtual DOM, supports multi-color highlights, and renders **bold** spans
    function renderPassageWithHighlights(text, phrases = [], onRemovePhrase = null) {
      if (!text) return '';

      const renderBoldInSegments = (segs) => {
        const result = [];
        segs.forEach((seg, sIdx) => {
          if (typeof seg !== 'string' || !seg.includes('**')) {
            result.push(seg);
            return;
          }
          const parts = seg.split(/\*\*([^*]+)\*\*/g);
          parts.forEach((part, pIdx) => {
            if (pIdx % 2 === 1) {
              result.push(
                <strong key={`bold-${sIdx}-${pIdx}`} className="font-semibold text-slate-900 dark:text-white underline decoration-indigo-400/60 underline-offset-4">
                  {part}
                </strong>
              );
            } else if (part.length > 0) {
              result.push(part);
            }
          });
        });
        return result.length === 1 && typeof result[0] === 'string' ? result[0] : result;
      };

      if (!phrases || phrases.length === 0) return renderBoldInSegments([text]);

      let segments = [text];
      phrases.forEach((phraseEntry, phraseIdx) => {
        const phrase = typeof phraseEntry === 'string' ? phraseEntry : (phraseEntry?.text || '');
        const color = (typeof phraseEntry === 'object' && phraseEntry?.color) ? phraseEntry.color : 'yellow';
        if (!phrase || phrase.trim().length === 0) return;
        const nextSegments = [];
        segments.forEach((seg, segIdx) => {
          if (typeof seg !== 'string') {
            nextSegments.push(seg);
            return;
          }
          const lowerSeg = seg.toLowerCase();
          const lowerPhrase = phrase.toLowerCase();
          let startIdx = 0;
          let matchIdx = lowerSeg.indexOf(lowerPhrase, startIdx);

          if (matchIdx === -1) {
            nextSegments.push(seg);
            return;
          }

          while (matchIdx !== -1) {
            if (matchIdx > startIdx) {
              nextSegments.push(seg.slice(startIdx, matchIdx));
            }
            const matchedText = seg.slice(matchIdx, matchIdx + phrase.length);
            nextSegments.push(
              <mark
                key={`hl-${phraseIdx}-${segIdx}-${matchIdx}`}
                onClick={onRemovePhrase ? (e) => { e.stopPropagation(); onRemovePhrase(phraseIdx); } : undefined}
                title={onRemovePhrase ? "Click to remove highlight" : undefined}
                className={`user-highlight user-highlight-${color} ${onRemovePhrase ? 'cursor-pointer hover:opacity-75' : ''}`}
              >
                {matchedText}
              </mark>
            );
            startIdx = matchIdx + phrase.length;
            matchIdx = lowerSeg.indexOf(lowerPhrase, startIdx);
          }
          if (startIdx < seg.length) {
            nextSegments.push(seg.slice(startIdx));
          }
        });
        segments = nextSegments;
      });

      return renderBoldInSegments(segments);
    }

      const baseTip = q.tip || MOCK_1_READING_TIPS[q.id] || null;

      if (q.questionType === 'words-in-context' && Array.isArray(q.options) && !baseTip.includes('Kelime Anlamları (TR):')) {
        const trList = q.options.map(optStr => {
          const m = optStr.match(/^([A-D])\)\s*(.+)$/);
          if (!m) return optStr;
          const letter = m[1];
          const word = m[2].trim();
          const tr = VOCAB_TURKISH_MEANINGS[word.toLowerCase()];
          return tr ? `${letter}) ${word}: ${tr}` : `${letter}) ${word}`;

      }
      return baseTip;

      constructor(seed) {
        this.s = seed;
      }
      next() {
        this.s = (this.s * 1664525 + 1013904223) % 4294967296;
        return this.s / 4294967296;
      }
      randInt(min, max) {
        return Math.floor(this.next() * (max - min + 1)) + min;
      }

          const prev1 = n >= 1 ? letterHistory[n - 1] : null;
          const prev2 = n >= 2 ? letterHistory[n - 2] : null;
          const prev3 = n >= 3 ? letterHistory[n - 3] : null;

          let candidates = letters.filter(L => {

            if (n >= 7 && letterHistory.slice(n - 3).join('') + L === letterHistory.slice(n - 7, n - 3).join('')) return false;
            return true;
          });

                  stem = `On an architectural blueprint, $1$ centimeter represents $${realMeters}$ meters of actual length. If a courtyard wall measures $${cmScale}$ centimeters on the blueprint, what is the actual length, in meters, of the wall?`;
                  options = this.makeOptions(correct, String(actualTotal), [String(actualTotal - realMeters), String(actualTotal + realMeters), String(realMeters + cmScale)]);
                  explanation = `Multiply the blueprint measurement by the scale factor: $${cmScale} \\times ${realMeters} = ${actualTotal}$ meters. Option ${correct} is correct.`;
                } else {
                  const rate = 38 + u * 2;
                  const hrs = 3 + (u % 5);
                  const dist = rate * hrs;
                  stem = `A passenger vehicle travels at an average speed of $${rate}$ miles per hour. At this rate, how many miles will the vehicle travel in $${hrs}$ hours?`;
                  options = this.makeOptions(correct, String(dist), [String(dist - 20), String(dist + 25), String(dist + 50)]);
                  explanation = `Distance $= \\text{rate} \\times \\text{time} = ${rate} \\times ${hrs} = ${dist}$ miles. Option ${correct} is correct.`;
                }
                break;
              }

              case 'percentages': {
                if (occ % 2 === 1) {
                  const initMembers = 200 + eIdx * 100;
                  const growthPct = [15, 20, 25, 30, 35, 40, 15, 25, 35][eIdx];
                  const newTotal = initMembers * (100 + growthPct) / 100;
                  stem = `A municipal botanical garden had $${initMembers}$ annual members last year. This year, the number of annual members increased by $${growthPct}\\%$. How many annual members does the botanical garden have this year?`;
                  options = this.makeOptions(correct, String(newTotal), [String(newTotal - 20), String(newTotal + 15), String(newTotal + 30)]);
                  explanation = `Multiply the initial membership by $(1 + \\frac{${growthPct}}{100})$: $${initMembers} \\times ${1 + growthPct / 100} = ${newTotal}$. Option ${correct} is correct.`;
                } else {
                  const orig = 60 + u * 20;
                  const pct = [15, 20, 25, 30, 35, 40][u % 6];
                  const discounted = orig * (100 - pct) / 100;
                  stem = `A winter jacket originally priced at $\\$${orig}$ is on sale for $${pct}\\%$ off. What is the sale price of the jacket before sales tax?`;
                  options = this.makeOptions(correct, `$${discounted}`, [`$${discounted - 6}`, `$${discounted + 8}`, `$${discounted + 14}`]);
                  explanation = `Sale price $= ${orig} \\times (1 - ${pct / 100}) = ${orig} \\times ${1 - pct / 100} = \\$${discounted}$. Option ${correct} is correct.`;
                }
                break;
              }

              case 'one-variable-data': {
                if (occ % 2 === 1) {
                  const v1 = 12 + eIdx * 2;
                  const v2 = v1 + 3;
                  const v3 = v1 + 7;
                  const v4 = v1 + 11;
                  const v5 = v1 + 16 + (eIdx % 3);
                  const rangeVal = v5 - v1;
                  stem = `The daily high temperatures, in degrees Celsius, recorded at an alpine weather station over five consecutive days were $${v3}$, $${v1}$, $${v5}$, $${v2}$, and $${v4}$. What is the range of these five recorded temperatures?`;
                  options = this.makeOptions(correct, String(rangeVal), [String(rangeVal - 5), String(rangeVal - 2), String(rangeVal + 4)]);
                  explanation = `The range of a data set is the maximum value minus the minimum value: $${v5} - ${v1} = ${rangeVal}$. Option ${correct} is correct.`;
                } else {
                  const baseMean = 72 + u;
                  const s1 = baseMean - 7;
                  const s2 = baseMean - 3;
                  const s3 = baseMean + 2;
                  const s4 = baseMean + 5 + (u % 3);
                  const fifthScore = 5 * baseMean - (s1 + s2 + s3 + s4);
                  stem = `A student scored $${s1}$, $${s2}$, $${s3}$, and $${s4}$ on four exams. What score must the student earn on the fifth exam to achieve an overall mean of $${baseMean}$?`;
                  options = this.makeOptions(correct, String(fifthScore), [String(fifthScore - 4), String(fifthScore + 2), String(fifthScore + 5)]);
                  explanation = `Total points needed for a mean of ${baseMean} over 5 exams is $5 \\times ${baseMean} = ${5 * baseMean}$. The sum of the first four exams is $${s1} + ${s2} + ${s3} + ${s4} = ${s1 + s2 + s3 + s4}$. Thus the fifth exam score must be $${5 * baseMean} - ${s1 + s2 + s3 + s4} = ${fifthScore}$. Option ${correct} is correct.`;
                }
                break;
              }

              case 'two-variable-data': {
                if (occ % 2 === 1) {
                  const initTemp = 82 + eIdx * 2;
                  const coolRate = [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 1.5, 2.5, 3.5][eIdx];
                  stem = `A scientist recorded the temperature $y$, in degrees Celsius, of a heated mineral sample $x$ minutes after removing it from a furnace. The line of best fit for the data is $y = ${initTemp} - ${coolRate}x$. What is the best interpretation of $${initTemp}$ in this context?`;
                  options = this.makeOptions(correct, `The predicted temperature, in degrees Celsius, of the sample when it was removed from the furnace ($x = 0$)`, [
                    `The rate, in degrees Celsius per minute, at which the sample cools`,

                  ]);
                  explanation = `In the linear model $y = ${initTemp} - ${coolRate}x$, the $y$-intercept $${initTemp}$ is the predicted value of $y$ when $x = 0$ (when the sample was removed from the furnace). Option ${correct} is correct.`;
                } else {
                  const mSlope = [1.5, 2.0, 2.5, 3.0, 3.5, 4.0][u % 6];

                  stem = `In a scatterplot showing the relationship between study hours $x$ and test score gains $y$, the line of best fit has equation $y = ${mSlope}x + 4$. According to this model, what is the predicted score gain for a student who studies for $${hrs}$ hours?`;
                  options = this.makeOptions(correct, String(pred), [String(pred - 5), String(pred + 4), String(pred + 9)]);
                  explanation = `Substitute $x = ${hrs}$: $y = ${mSlope}(${hrs}) + 4 = ${mSlope * hrs} + 4 = ${pred}$. Option ${correct} is correct.`;

              case 'probability': {
                if (occ % 2 === 1) {

                  stem = `In a clinical study of $${total}$ participants, $${nA}$ participants received Treatment X and $${nB}$ received a placebo. Of those who received Treatment X, $${nSuccess}$ experienced symptom relief. If a participant who received Treatment X is selected at random, what is the probability that the participant experienced symptom relief?`;
                  options = this.makeOptions(correct, `${nSuccess}/${nA}`, [`${nSuccess}/${total}`, `${nA}/${total}`, `${nA - nSuccess}/${nA}`]);
                  explanation = `Given that the selected participant received Treatment X (sample space $= ${nA}$), the conditional probability of symptom relief is $\\frac{${nSuccess}}{${nA}}$. Option ${correct} is correct.`;
                } else {
                  const nA = 11 + eIdx * 2;
                  const nB = 6 + eIdx;
                  const total = nA + nB;
                  stem = `A box contains $${nA}$ red marbles and $${nB}$ blue marbles. If one marble is randomly selected from the box, what is the probability that the selected marble is red?`;
                  options = this.makeOptions(correct, `${nA}/${total}`, [`${nB}/${total}`, `${nA - nB}/${total}`, `${nB}/${nA}`]);

              case 'sample-statistics-experiments': {

                stem = `A researcher surveyed a representative random sample of $${nSample}$ registered voters in a city and found that $${pct}\\%$ support a proposed municipal transit expansion, with a margin of error of $${moe}\\%$. Which of the following conclusions is best supported by this survey?`;
                const correctText = `It is plausible that between ${low}% and ${high}% of all registered voters in the city support the expansion.`;

              case 'area-and-volume': {

                explanation = `Volume of cylinder $= \\pi r^2 h = \\pi (${rad})^2 (${h}) = ${vol}\\pi$. Option ${correct} is correct.`;

              case 'lines-angles-triangles': {
                const a1 = 32 + u * 2;
                const a2 = 48 + (u % 7) * 3;
                const a3 = 180 - a1 - a2;
                stem = `In triangle $ABC$, the measure of angle $A$ is $${a1}^\\circ$ and the measure of angle $B$ is $${a2}^\\circ$. What is the measure of angle $C$?`;
                options = this.makeOptions(correct, `${a3}°`, [`${a3 - 10}°`, `${a3 + 10}°`, `${180 - a1}°`]);
                explanation = `The interior angles of a triangle sum to $180^\\circ$: $\\angle C = 180^\\circ - (${a1}^\\circ + ${a2}^\\circ) = 180^\\circ - ${a1 + a2}^\\circ = ${a3}^\\circ$. Option ${correct} is correct.`;

              }

              case 'right-triangle-trigonometry': {
                const ang = 18 + u * 3;

                stem = `In a right triangle, one acute angle measures $${ang}^\\circ$. Which of the following expressions is equivalent to $\\sin(${ang}^\\circ)$?`;
                options = this.makeOptions(correct, `$\\cos(${comp}^\\circ)$`, [
                  `$\\cos(${ang}^\\circ)$`,
                  `$\\tan(${comp}^\\circ)$`,
                  `$\\sin(${comp}^\\circ)$`
                ]);
                explanation = `By the co-function identity for complementary angles, $\\sin(\\theta) = \\cos(90^\\circ - \\theta)$. Therefore, $\\sin(${ang}^\\circ) = \\cos(${comp}^\\circ)$. Option ${correct} is correct.`;

              }

              case 'circles':
              default: {
                if (occ % 2 === 1) {
                  const r = 5 + eIdx;
                  const h = 2 + eIdx;
                  const k = 3 + (eIdx % 5);

                  stem = `In the $xy$-plane, the graph of the equation $x^2 + y^2 - ${2 * h}x + ${2 * k}y = ${rhsConst}$ is a circle. What is the radius of this circle?`;
                  options = this.makeOptions(correct, String(r), [String(r * r), String(h + k), String(2 * r)]);
                  explanation = `Complete the square: $(x - ${h})^2 + (y + ${k})^2 = ${rhsConst} + ${h * h} + ${k * k} = ${r * r}$. Thus $r = \\sqrt{${r * r}} = ${r}$. Option ${correct} is correct.`;
                } else {
                  const r = 4 + eIdx;
                  const h = 3 + eIdx;
                  const k = 2 + (eIdx % 6);

                  stem = `A circle in the $xy$-plane has equation $(x - ${h})^2 + (y + ${k})^2 = ${r * r}$. If the horizontal line $y = c$ is tangent to the topmost point of the circle, what is the value of $c$?`;
                  options = this.makeOptions(correct, String(cVal), [String(cVal - 2), String(cVal + 2), String(cVal + 5)]);
                  explanation = `The center is $(${h}, -${k})$ and the radius is $${r}$. The topmost point is $(${h}, -${k} + ${r}) = (${h}, ${cVal})$. Thus $y = ${cVal}$. Option ${correct} is correct.`;

            return {
              id,
              examId,
              section: 'math',
              module,

              passage: null,
              stem,
              options,

            };
          } else {
            // Diverse SPR Grid-In Questions with exact domain & questionType alignment
            let stem, correctAnswer, explanation, sprDomain, sprQuestionType;

            if (module === 1) {
              switch (sprIndex) {
                case 0: { // linear equation SPR
                  sprDomain = 'algebra';
                  sprQuestionType = 'linear-equations-one-var';
                  const m = 3 + (eIdx % 4);
                  const c = 4 + eIdx;
                  const xAns = 5 + eIdx * 2;
                  const rhs = m * xAns + c;
                  stem = `If $${m}x + ${c} = ${rhs}$, what is the value of $x$?`;

                case 1: { // radicals SPR

                }
                case 2: { // percentages SPR

                  stem = `A store increased the price of an item from $\\$${baseVal}$ to $\\$${finalVal}$. What is the percentage increase in the price of the item?`;
                  correctAnswer = [String(incPct)];
                  explanation = `Percentage increase $= \\frac{${finalVal} - ${baseVal}}{${baseVal}} \\times 100 = \\frac{${finalVal - baseVal}}{${baseVal}} \\times 100 = ${incPct}\\%$.`;

                }
                case 3: { // circles SPR
                  sprDomain = 'geometry-and-trigonometry';
                  sprQuestionType = 'circles';
                  const rad = 3 + eIdx;

                  explanation = `In $(x - h)^2 + (y - k)^2 = r^2$, $r^2 = ${rad * rad} \\implies r = ${rad}$.`;

                }
                case 4: { // quadratics SPR
                  sprDomain = 'advanced-math';
                  sprQuestionType = 'quadratics';

                  correctAnswer = [String(r2)];
                  explanation = `Factor $(x - ${r1})(x - ${r2}) = 0$. Since $x > ${r1}$, $x = ${r2}$.`;

                }
                case 5:
                default: { // ratios SPR

                  const n2 = 10 + eIdx * 2;
                  const scale = 2 + (eIdx % 4);

                  correctAnswer = [String(n4)];
                  explanation = `Cross-multiply: $${n1}y = ${n2} \\times ${n3} = ${n2 * n3} \\implies y = \\frac{${n2 * n3}}{${n1}} = ${n4}$.`;

                }
              }
            } else {
              // Module 2 SPR
              switch (sprIndex) {

                  sprDomain = 'algebra';

                  const m = 2 + (eIdx % 5);

                  const y2 = y1 + m * (x2 - x1);
                  stem = `In the $xy$-plane, what is the slope of the line passing through points $(${x1}, ${y1})$ and $(${x2}, ${y2})$?`;
                  correctAnswer = [String(m)];
                  explanation = `Slope $= \\frac{${y2} - ${y1}}{${x2} - ${x1}} = \\frac{${y2 - y1}}{${x2 - x1}} = ${m}$.`;
                  break;
                }
                case 1: { // systems solution x + y SPR
                  sprDomain = 'algebra';
                  sprQuestionType = 'systems-linear-equations';
                  const xAns = 3 + eIdx;
                  const yAns = 2 + (eIdx % 5);
                  const c1 = 2 * xAns + yAns;
                  const c2 = xAns - yAns;
                  const sum = xAns + yAns;
                  stem = `$$\\begin{cases} 2x + y = ${c1} \\\\ x - y = ${c2} \\end{cases}$$\nIf $(x, y)$ is the solution to the system of equations above, what is the value of $x + y$?`;
                  correctAnswer = [String(sum)];
                  explanation = `Adding the two equations: $3x = ${c1 + c2} \\implies x = ${xAns}$. Then $y = x - ${c2} = ${yAns}$. Thus $x + y = ${sum}$.`;
                  break;
                }
                case 2: { // exponentials SPR
                  sprDomain = 'advanced-math';
                  sprQuestionType = 'exponentials';
                  const expPairs = [[2, 3], [2, 5], [2, 7], [3, 3], [3, 4], [3, 5], [4, 3], [5, 3], [6, 3]];
                  const [p, qPow] = expPairs[eIdx];
                  const totalVal = Math.pow(p, qPow);
                  const xNum = (qPow + 1) / 2;
                  const xStr = Number.isInteger(xNum) ? String(xNum) : `${qPow + 1}/2`;
                  stem = `If $${p}^{2x - 1} = ${totalVal}$, what is the value of $x$?`;
                  correctAnswer = Number.isInteger(xNum) ? [xStr] : [xStr, String(xNum)];
                  explanation = `Set exponents equal: $2x - 1 = ${qPow} \\implies 2x = ${qPow + 1} \\implies x = ${xStr}$.`;
                  break;
                }
                case 3: { // quadratic vertex SPR
                  sprDomain = 'advanced-math';
                  sprQuestionType = 'quadratics';
                  const h = 3 + eIdx;
                  const b = 2 * h;
                  stem = `What is the $x$-coordinate of the vertex of the parabola $y = x^2 - ${b}x + 15$?`;
                  correctAnswer = [String(h)];
                  explanation = `Vertex $x$-coordinate is $-\\frac{b}{2a} = -\\frac{-${b}}{2(1)} = ${h}$.`;
                  break;
                }
                case 4: { // volume of rectangular prism SPR
                  sprDomain = 'geometry-and-trigonometry';
                  sprQuestionType = 'area-and-volume';
                  const l = 3 + eIdx;
                  const w = 2 + (eIdx % 4);
                  const h = 4 + (eIdx % 5);
                  const vol = l * w * h;
                  stem = `A rectangular prism has a length of $${l}$ cm, a width of $${w}$ cm, and a height of $${h}$ cm. What is the volume, in cubic centimeters, of the prism?`;
                  correctAnswer = [String(vol)];
                  explanation = `Volume $= \\text{length} \\times \\text{width} \\times \\text{height} = ${l} \\times ${w} \\times ${h} = ${vol}$.`;
                  break;
                }
                case 5:
                default: { // circles arc length SPR
                  sprDomain = 'geometry-and-trigonometry';
                  sprQuestionType = 'circles';
                  const arcPairs = [[6, 60], [6, 90], [6, 120], [9, 60], [9, 80], [9, 120], [12, 45], [12, 60], [12, 75]];
                  const [r, deg] = arcPairs[eIdx];
                  const k = (deg * r) / 180;
                  stem = `In a circle with radius $${r}$, an arc has central angle $${deg}^\\circ$. The length of the arc is $k\\pi$. What is the value of $k$?`;
                  correctAnswer = [String(k)];
                  explanation = `Arc length $= \\frac{\\theta}{360} \\times 2\\pi r = \\frac{${deg}}{360} \\times 2\\pi(${r}) = ${k}\\pi$. Thus $k = ${k}$.`;
                  break;
                }
              }
            }

            return {
              id,
              examId,
              section: 'math',
              module,
              domain: sprDomain,
              questionType: sprQuestionType,
              difficulty: diff,
              passage: null,
              stem,
              options: null,
              correctAnswer,
              explanation
            };
          }
        };

        // Math Module 1: 22 Questions (16 MC + 6 SPR)
        for (let i = 1; i <= 22; i++) {
          const id = `m${examId}-math1-${i < 10 ? '0' + i : i}`;
          examQuestions.push(generateMathQuestion(id, 1, i, i >= 17));
        }

        // Math Module 2: 22 Questions (16 MC + 6 SPR)
        for (let i = 1; i <= 22; i++) {
          const id = `m${examId}-math2-${i < 10 ? '0' + i : i}`;
          examQuestions.push(generateMathQuestion(id, 2, i, i >= 17));
        }

        return examQuestions;
      }
    }

    // ==========================================
    // 10. EVALUATOR & SCORING ENGINES
    // ==========================================
    /**
     * Evaluates Student-Produced Response grid-ins against correct answers.
     * Pure JS supporting fractions, decimals, unsimplified forms, negative numbers,
     * and repeating decimal rounding/truncation.
     */
    function evaluateGridIn(rawUserAnswer, correctAnswer, tolerance = 1e-5) {
      if (rawUserAnswer === undefined || rawUserAnswer === null) {
        return { isCorrect: false, normalizedUser: null, message: "Empty response" };
      }

      const userStr = String(rawUserAnswer).trim();
      if (userStr === "") {
        return { isCorrect: false, normalizedUser: null, message: "Empty response" };
      }

      // Reject invalid characters
      if (!/^-?[0-9.\/]+$/.test(userStr)) {
        return { isCorrect: false, normalizedUser: null, message: "Invalid characters in input" };
      }

      // Reject multiple negative signs or negative sign not at index 0
      if ((userStr.match(/-/g) || []).length > 1 || (userStr.includes("-") && !userStr.startsWith("-"))) {
        return { isCorrect: false, normalizedUser: null, message: "Invalid negative sign placement" };
      }

      // Reject multiple fraction slashes
      if ((userStr.match(/\//g) || []).length > 1) {
        return { isCorrect: false, normalizedUser: null, message: "Multiple fraction slashes not allowed" };
      }

      // Reject decimals inside fractions per SAT rules (e.g. "1.5/2", "3/1.5")
      if (userStr.includes('/') && userStr.includes('.')) {
        return { isCorrect: false, normalizedUser: null, message: "Decimals in fractions not permitted per SAT rules" };
      }

      // Reject multiple decimal points in numerator or denominator
      const parts = userStr.split("/");
      for (const part of parts) {
        if ((part.match(/\./g) || []).length > 1) {
          return { isCorrect: false, normalizedUser: null, message: "Multiple decimal points in number" };
        }
      }

      // Parse numerical value
      let userVal;
      if (userStr.includes("/")) {
        const [numStr, denStr] = userStr.split("/");
        const num = parseFloat(numStr);
        const den = parseFloat(denStr);
        if (isNaN(num) || isNaN(den) || den === 0) {
          return { isCorrect: false, normalizedUser: null, message: "Division by zero or invalid fraction" };
        }
        userVal = num / den;
      } else {
        userVal = parseFloat(userStr);
        if (isNaN(userVal)) {
          return { isCorrect: false, normalizedUser: null, message: "Unable to parse numeric value" };
        }
      }

      const targets = Array.isArray(correctAnswer) ? correctAnswer : [correctAnswer];

      for (const target of targets) {
        const targetStr = String(target).trim();

        // 1. Exact string match
        if (userStr.toLowerCase() === targetStr.toLowerCase()) {
          return { isCorrect: true, normalizedUser: userVal, message: "Exact match" };
        }

        // 2. Parse target numeric value
        let targetVal;
        if (targetStr.includes("/")) {
          const [tNum, tDen] = targetStr.split("/");
          targetVal = parseFloat(tNum) / parseFloat(tDen);
        } else {
          targetVal = parseFloat(targetStr);
        }

        if (isNaN(targetVal)) continue;

        // Floating point equivalence within tolerance
        if (Math.abs(userVal - targetVal) <= tolerance) {
          return { isCorrect: true, normalizedUser: userVal, message: "Numerical equivalence match" };
        }

        // Repeating decimal truncation/rounding check

            const trunc3 = (isPositive ? "" : "-") + "0." + decPart.slice(0, 3);

            const round4Val = (Math.round(targetVal * 10000) / 10000).toString();

            if ([trunc3, trunc4, round3Val, round4Val].includes(cleanUser)) {
              return { isCorrect: true, normalizedUser: userVal, message: "Repeating decimal rounding match" };

        }
      }

      return { isCorrect: false, normalizedUser: userVal, message: "Value does not match expected answer" };

    /**
     * Calculates scaled section score (200 - 800) using official adaptive routing:
     * Reading & Writing: threshold = 18 correct in M1 -> Hard M2.
     * Math: threshold = 15 correct in M1 -> Hard M2.
     * Easy Module 2 is capped at <= 590.
     * Hard Module 2 ranges from 450/480 to 800.
     * Quantized to multiples of 10.
     */
    function calculateScaledScore(m1Raw, m2Raw, section) {
      const s = String(section || '').toLowerCase().trim();
      const isRW = s === 'reading-writing' || s === 'rw' || s === 'reading_writing' || s === 'reading' || s === 'reading & writing';
      const m1Max = isRW ? 27 : 22;
      const m2Max = isRW ? 27 : 22;
      const totalMax = m1Max + m2Max;
      const threshold = isRW ? 18 : 15;

      const rawTotal = m1Raw + m2Raw;
      const tier = m1Raw >= threshold ? 'hard' : 'easy';

      let scaledScore = 200;

      if (tier === 'hard') {
        const baseline = 480;
        const remainingRaw = Math.max(0, rawTotal - threshold);
        const maxRemaining = totalMax - threshold;
        const fraction = remainingRaw / maxRemaining;

        scaledScore = Math.round(baseline + fraction * 320);
        scaledScore = Math.round(scaledScore / 10) * 10;
        scaledScore = Math.min(800, Math.max(480, scaledScore));
      } else {
        const fraction = rawTotal / (threshold - 1 + m2Max);
        scaledScore = Math.round(200 + fraction * 390);
        scaledScore = Math.round(scaledScore / 10) * 10;
        scaledScore = Math.min(590, Math.max(200, scaledScore));
      }

      return { scaledScore, tier, rawTotal, maxRaw: totalMax };
    }

          console.warn("Failed saving state to localStorage:", e);
        }
      }, [state]);

      const toggleTheme = () => {
        setState(prev => ({
          ...prev,
          settings: {
            ...prev.settings,
            theme: prev.settings.theme === "dark" ? "light" : "dark"
          }
        }));
      };

      const saveExamAttempt = (record) => {
        setState(prev => ({
          ...prev,
          examHistory: [record, ...prev.examHistory],
          activeExam: null
        }));
      };

      const recordDrillResult = (drillResult) => {
        setState(prev => ({
          ...prev,
          drillHistory: [drillResult, ...prev.drillHistory]
        }));
      };

      const saveCustomNote = (noteKey, noteText) => {
        if (!noteKey) return;
        setState(prev => ({
          ...prev,
          customNotes: {
            ...(prev.customNotes || {}),
            [noteKey]: noteText
          }
        }));
      };

      const exportStateJson = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
        const downloadAnchor = document.createElement("a");
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `digital-sat-prep-export-${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importStateJson = (jsonString) => {
        try {
          if (typeof jsonString !== "string" || !jsonString.trim()) {
            return { success: false, message: "Invalid payload: Input must be a non-empty string." };
          }
          // Guard against oversize payload (>5MB)
          const MAX_SIZE_BYTES = 5 * 1024 * 1024; // 5MB
          if (jsonString.length > MAX_SIZE_BYTES) {
            return { success: false, message: "Payload size exceeds maximum allowed limit (5MB)." };
          }

          const parsed = JSON.parse(jsonString);
          if (!parsed || typeof parsed !== "object" || parsed.version !== 1 || !parsed.settings || !Array.isArray(parsed.examHistory)) {
            return { success: false, message: "Invalid backup file schema." };
          }

          // Validate examHistory item structure
          const isValidExamHistory = parsed.examHistory.every(item =>
            item &&
            typeof item === "object" &&
            typeof item.id === "string" &&
            (typeof item.examId === "number" || typeof item.examId === "string") &&
            item.scores &&
            typeof item.scores === "object"
          );

          if (!isValidExamHistory) {
            return { success: false, message: "Invalid backup file: examHistory records are malformed." };
          }

          setState(prev => ({ ...prev, ...parsed }));
          return { success: true, message: "Data successfully restored!" };
        } catch (e) {
          return { success: false, message: "Error parsing JSON file." };
        }
      };

      const resetAllData = () => {
        setState({
          ...DEFAULT_APP_STATE,
          settings: { ...DEFAULT_APP_STATE.settings, theme: state.settings.theme }
        });
      };

      return {
        state,
        setState,
        toggleTheme,
        saveExamAttempt,
        recordDrillResult,
        saveCustomNote,
        exportStateJson,
        importStateJson,
        resetAllData
      };
    }

    // ==========================================
    // 12. IN-EXAM MODALS & TOOLS
    // ==========================================

    // Multi-Color Highlighter Control Bar (Student & Lesson Friendly)
    const HIGHLIGHT_COLORS = [
      { id: 'yellow', label: 'Main Idea (Yellow)', bg: 'bg-yellow-300', swatch: 'bg-yellow-300', ring: 'ring-yellow-500' },
      { id: 'green', label: 'Evidence (Green)', bg: 'bg-emerald-300', swatch: 'bg-emerald-300', ring: 'ring-emerald-500' },
      { id: 'blue', label: 'Vocab / Key Term (Blue)', bg: 'bg-sky-300', swatch: 'bg-sky-300', ring: 'ring-sky-500' },
      { id: 'pink', label: 'Contrast / Trap (Pink)', bg: 'bg-pink-300', swatch: 'bg-pink-300', ring: 'ring-pink-500' }
    ];

    // Interactive Pen, Highlighter Brush & Math Scratchpad (Simplified, Humanized & Non-Blocking)
    function DrawingScratchpadModal({ isOpen, onClose, contextKey = 'default', contextLabel, contextTitle, drawings: propDrawings, setDrawings: propSetDrawings }) {
      const resolvedLabel = contextLabel || contextTitle || 'Not';
      const [localDrawings, setLocalDrawings] = React.useState({});
      const drawings = propDrawings || localDrawings;
      const setDrawings = propSetDrawings || setLocalDrawings;

      const canvasRef = React.useRef(null);
      const isDrawingRef = React.useRef(false);
      const currentStrokeRef = React.useRef(null);

      // Default to 'overlay' with bottom-docked slim pill so questions at the top are never blocked
      const [boardMode, setBoardMode] = React.useState('overlay'); // 'overlay' (On-screen) | 'board' (Mini Corner Pad)
      const [clickThrough, setClickThrough] = React.useState(false);
      const [isMinimized, setIsMinimized] = React.useState(false);
      const [dockPos, setDockPos] = React.useState('bottom'); // 'bottom' | 'top-right'
      const [dragOffset, setDragOffset] = React.useState({ x: 0, y: 0 });
      const dragStartRef = React.useRef(null);

      const [tool, setTool] = React.useState('pen'); // 'pen' | 'highlighter' | 'eraser'
      const [penColor, setPenColor] = React.useState('#4f46e5');
      const [penWidth, setPenWidth] = React.useState(3);

      const activeStrokes = React.useMemo(() => (drawings && drawings[contextKey]) || [], [drawings, contextKey]);

      const PEN_COLORS = [
        { hex: '#4f46e5', name: 'Mavi (Indigo)' },
        { hex: '#e11d48', name: 'Kırmızı (Rose)' },
        { hex: '#059669', name: 'Yeşil (Emerald)' },
        { hex: '#d97706', name: 'Turuncu (Amber)' },
        { hex: '#1e293b', name: 'Siyah (Slate)' }
      ];

      // Redraw all strokes for active contextKey
      const redrawCanvas = React.useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const allStrokes = currentStrokeRef.current ? [...activeStrokes, currentStrokeRef.current] : activeStrokes;
        allStrokes.forEach(stroke => {
          if (!stroke.points || stroke.points.length === 0) return;
          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (stroke.tool === 'eraser') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = 22;
            ctx.strokeStyle = 'rgba(0,0,0,1)';
          } else if (stroke.tool === 'highlighter') {
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 0.32;
            ctx.lineWidth = 16;
            ctx.strokeStyle = stroke.color || '#eab308';
          } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1.0;
            ctx.lineWidth = stroke.width || 3;
            ctx.strokeStyle = stroke.color || '#4f46e5';
          }

          ctx.beginPath();
          ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
          for (let i = 1; i < stroke.points.length; i++) {
            ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
          }
          if (stroke.points.length === 1) {
            ctx.lineTo(stroke.points[0].x + 0.5, stroke.points[0].y + 0.5);
          }
          ctx.stroke();
          ctx.restore();
        });
      }, [activeStrokes]);

      React.useEffect(() => {
        if (!isOpen) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const resize = () => {
          if (!canvas.parentElement) return;
          const rect = canvas.parentElement.getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0) {
            canvas.width = rect.width;
            canvas.height = rect.height;
            redrawCanvas();
          }
        };
        resize();
        window.addEventListener('resize', resize);
        return () => window.removeEventListener('resize', resize);
      }, [isOpen, boardMode, isMinimized, contextKey, redrawCanvas]);

      React.useEffect(() => {
        if (isOpen) redrawCanvas();
      }, [isOpen, activeStrokes, redrawCanvas]);

      if (!isOpen) return null;

      const getCoords = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return { x: 0, y: 0 };
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      };

      const handlePointerDown = (e) => {
        if (boardMode === 'overlay' && clickThrough) return;
        isDrawingRef.current = true;
        const pt = getCoords(e);
        currentStrokeRef.current = {
          tool,
          color: penColor,
          width: penWidth,
          points: [pt]
        };
        redrawCanvas();
      };

      const handlePointerMove = (e) => {
        if (!isDrawingRef.current || !currentStrokeRef.current) return;
        const pt = getCoords(e);
        currentStrokeRef.current.points.push(pt);
        redrawCanvas();
      };

      const handlePointerUp = () => {
        if (!isDrawingRef.current || !currentStrokeRef.current) return;
        isDrawingRef.current = false;
        const finishedStroke = currentStrokeRef.current;
        currentStrokeRef.current = null;
        if (setDrawings) {
          setDrawings(prev => ({
            ...prev,
            [contextKey]: [...((prev && prev[contextKey]) || []), finishedStroke]
          }));
        }
      };

      const handleUndo = () => {
        if (!setDrawings) return;
        setDrawings(prev => {
          const list = (prev && prev[contextKey]) || [];
          return { ...prev, [contextKey]: list.slice(0, -1) };
        });
      };

      const handleClear = () => {
        if (!setDrawings) return;
        setDrawings(prev => ({ ...prev, [contextKey]: [] }));
      };

      const cycleWidth = () => {
        setPenWidth(prev => (prev === 2 ? 4 : prev === 4 ? 6 : 2));
      };

      // Dragging support for the toolbar pill / card
      const startToolbarDrag = (e) => {
        if (e.target.closest('button')) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        dragStartRef.current = {
          startX: clientX - dragOffset.x,
          startY: clientY - dragOffset.y
        };
        const onMove = (moveEvent) => {
          if (!dragStartRef.current) return;
          const cx = moveEvent.touches ? moveEvent.touches[0].clientX : moveEvent.clientX;
          const cy = moveEvent.touches ? moveEvent.touches[0].clientY : moveEvent.clientY;
          setDragOffset({
            x: cx - dragStartRef.current.startX,
            y: cy - dragStartRef.current.startY
          });
        };
        const onUp = () => {
          dragStartRef.current = null;
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onUp);
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        window.addEventListener('touchmove', onMove);
        window.addEventListener('touchend', onUp);
      };

      // Minimized Floating Chip (never blocks anything)
      if (isMinimized) {
        return (
          <div className="fixed bottom-16 right-4 z-50 flex items-center space-x-1.5 bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md border border-slate-200 dark:border-zinc-700 rounded-full px-3 py-1.5 shadow-lg">
            <button
              onClick={() => setIsMinimized(false)}
              className="flex items-center space-x-1.5 text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline"
              title="Kalem araç çubuğunu aç"
            >
              <Icon name="PenTool" className="w-3.5 h-3.5" />
              <span>Kalem Açık ({activeStrokes.length})</span>
            </button>
            <button
              onClick={onClose}
              className="p-0.5 text-slate-400 hover:text-rose-500 rounded-full"
              title="Kapat"
            >
              <Icon name="X" className="w-3.5 h-3.5" />
            </button>
          </div>
        );
      }

      const pillPositionClass =
        dockPos === 'bottom'
          ? 'fixed bottom-16 right-4'
          : 'fixed bottom-16 left-4';

      return (
        <div
          className={
            boardMode === 'overlay'
              ? `fixed top-14 bottom-14 left-0 right-0 z-30 ${clickThrough ? 'pointer-events-none' : ''}`
              : 'fixed bottom-16 right-4 z-40 w-[88vw] sm:w-[340px] h-[250px] bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md border border-slate-200/90 dark:border-zinc-700 rounded-2xl shadow-xl flex flex-col overflow-hidden'
          }
          style={
            boardMode === 'board' && (dragOffset.x !== 0 || dragOffset.y !== 0)
              ? { transform: `translate(${dragOffset.x}px, ${dragOffset.y}px)` }
              : undefined
          }
        >
          {/* Single Compact, Humanized Toolbar Pill (Docked at bottom-right in empty margin so questions & options are 100% unobstructed) */}
          <div
            onMouseDown={startToolbarDrag}
            onTouchStart={startToolbarDrag}
            style={
              boardMode === 'overlay' && (dragOffset.x !== 0 || dragOffset.y !== 0)
                ? { transform: `translate(${dragOffset.x}px, ${dragOffset.y}px)` }
                : undefined
            }
            className={
              boardMode === 'overlay'
                ? `pointer-events-auto ${pillPositionClass} z-50 bg-white/95 dark:bg-zinc-900/95 text-slate-800 dark:text-zinc-100 backdrop-blur-md border border-slate-200/90 dark:border-zinc-700/90 rounded-full px-2.5 py-1 shadow-lg flex flex-wrap items-center gap-1 max-w-[95vw] cursor-move select-none`
                : 'bg-slate-50/95 dark:bg-zinc-800/95 text-slate-800 dark:text-zinc-100 px-2.5 py-1.5 border-b border-slate-200 dark:border-zinc-700 flex flex-wrap items-center justify-between gap-1 shrink-0 cursor-move select-none'
            }
            title="Sürükleyerek istediğiniz yere taşıyabilirsiniz"
          >
            {/* Drag Handle Indicator */}
            <span className="text-slate-300 dark:text-zinc-600 text-xs px-1 cursor-grab" title="Taşımak için sürükleyin">
              ⋮⋮
            </span>

            {/* In Overlay Mode: Quick Click-Through ("Seç") vs Draw Toggle */}
            {boardMode === 'overlay' && (
              <button
                onClick={() => setClickThrough(prev => !prev)}
                className={`px-2.5 py-1 rounded-full text-[11px] font-semibold transition flex items-center space-x-1 ${
                  clickThrough
                    ? 'bg-emerald-600 text-white shadow-xs'
                    : 'bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300 hover:bg-slate-200 dark:hover:bg-zinc-700'
                }`}
                title="Şıkları işaretlemek veya sayfayı kaydırmak için Seç moduna geçin"
              >
                <span>{clickThrough ? '👆 Şık Seç' : '✏️ Çiz'}</span>
              </button>
            )}

            {/* Core Drawing Tools: Kalem, Fosforlu, Silgi */}
            <div className="flex items-center bg-slate-100 dark:bg-zinc-800 rounded-full p-0.5">
              <button
                onClick={() => { setTool('pen'); setClickThrough(false); }}
                className={`px-2.5 py-1 rounded-full text-[11px] font-semibold flex items-center space-x-1 transition ${
                  tool === 'pen' && !clickThrough
                    ? 'bg-indigo-600 text-white shadow-xs'
                    : 'text-slate-600 dark:text-zinc-300 hover:text-slate-900 dark:hover:text-white'
                }`}
                title="Kalem"
              >
                <Icon name="PenTool" className="w-3 h-3" />
                <span>Kalem</span>
              </button>
              <button
                onClick={() => { setTool('highlighter'); setClickThrough(false); }}
                className={`px-2 py-1 rounded-full text-[11px] font-semibold flex items-center space-x-1 transition ${
                  tool === 'highlighter' && !clickThrough
                    ? 'bg-amber-400 text-slate-950 shadow-xs'
                    : 'text-slate-600 dark:text-zinc-300 hover:text-slate-900 dark:hover:text-white'
                }`}
                title="Fosforlu Kalem"
              >
                <Icon name="Highlighter" className="w-3 h-3" />
                <span className="hidden sm:inline">Fosforlu</span>
              </button>
              <button
                onClick={() => { setTool('eraser'); setClickThrough(false); }}
                className={`px-2 py-1 rounded-full text-[11px] font-semibold flex items-center space-x-1 transition ${
                  tool === 'eraser' && !clickThrough
                    ? 'bg-rose-600 text-white shadow-xs'
                    : 'text-slate-600 dark:text-zinc-300 hover:text-slate-900 dark:hover:text-white'
                }`}
                title="Silgi"
              >
                <Icon name="Eraser" className="w-3 h-3" />
                <span className="hidden sm:inline">Silgi</span>
              </button>
            </div>

            {/* Clean Color Dots */}
            <div className="flex items-center space-x-1 px-1">
              {PEN_COLORS.map(c => (
                <button
                  key={c.hex}
                  onClick={() => { setPenColor(c.hex); if (tool === 'eraser') setTool('pen'); setClickThrough(false); }}
                  title={c.name}
                  style={{ backgroundColor: c.hex }}
                  className={`w-3.5 h-3.5 rounded-full transition ${
                    penColor === c.hex && tool !== 'eraser'
                      ? 'ring-2 ring-offset-1 ring-indigo-500 scale-110'
                      : 'opacity-70 hover:opacity-100'
                  }`}
                />
              ))}
            </div>

            {/* 1-Click Stroke Width Cycle */}
            <button
              onClick={cycleWidth}
              className="w-6 h-6 rounded-full bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 dark:hover:bg-zinc-700 flex items-center justify-center text-[10px] font-bold text-slate-700 dark:text-zinc-300"
              title={`Çizgi Kalınlığı: ${penWidth === 2 ? 'İnce' : penWidth === 4 ? 'Orta' : 'Kalın'} (Değiştirmek için tıklayın)`}
            >
              <span
                className="rounded-full bg-current"
                style={{ width: `${penWidth + 2}px`, height: `${penWidth + 2}px` }}
              />
            </button>

            {/* Undo & Clear */}
            <div className="flex items-center space-x-1">
              <button
                onClick={handleUndo}
                disabled={activeStrokes.length === 0}
                className="px-2 py-1 rounded-full bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 dark:hover:bg-zinc-700 disabled:opacity-40 text-[11px] font-medium text-slate-700 dark:text-zinc-300"
                title="Son çizgiyi geri al"
              >
                ↩
              </button>
              <button
                onClick={handleClear}
                disabled={activeStrokes.length === 0}
                className="px-2 py-1 rounded-full bg-rose-50 dark:bg-rose-950/50 hover:bg-rose-100 disabled:opacity-40 text-[11px] font-medium text-rose-600 dark:text-rose-400"
                title="Tüm çizimleri temizle"
              >
                Temizle
              </button>
            </div>

            {/* Switch between On-Screen (Ekran) and Corner Pad (Kağıt) */}
            <button
              onClick={() => {
                setBoardMode(prev => (prev === 'overlay' ? 'board' : 'overlay'));
                setClickThrough(false);
                setDragOffset({ x: 0, y: 0 });
              }}
              className="px-2.5 py-1 rounded-full bg-indigo-50 dark:bg-indigo-950/60 hover:bg-indigo-100 text-indigo-700 dark:text-indigo-300 text-[11px] font-semibold transition"
              title={boardMode === 'overlay' ? 'Köşede küçük kareli kağıt aç' : 'Doğrudan ekran üzerinde çiz'}
            >
              {boardMode === 'overlay' ? '📐 Kareli Kağıt' : '🖥️ Ekran Üstü'}
            </button>

            {/* Minimize & Close */}
            <div className="flex items-center space-x-0.5 ml-0.5">
              <button
                onClick={() => setIsMinimized(true)}
                className="p-1 hover:bg-slate-200 dark:hover:bg-zinc-800 rounded-full text-slate-400 hover:text-slate-700 dark:hover:text-zinc-200"
                title="Araç çubuğunu küçült"
              >
                <span className="text-xs font-bold leading-none px-1">–</span>
              </button>
              <button
                onClick={onClose}
                className="p-1 hover:bg-rose-100 dark:hover:bg-rose-950/60 rounded-full text-slate-400 hover:text-rose-600"
                title="Kalemi kapat"
              >
                <Icon name="X" className="w-3.5 h-3.5" />
              </button>
            </div>
          </div>

          {/* Drawing Canvas Area */}
          <div
            className="flex-1 relative w-full h-full overflow-hidden"
            style={
              boardMode === 'board'
                ? {
                    backgroundImage: 'radial-gradient(rgba(99, 102, 241, 0.2) 1px, transparent 1px)',
                    backgroundSize: '16px 16px'
                  }
                : undefined
            }
          >
            <canvas
              ref={canvasRef}
              onMouseDown={handlePointerDown}
              onMouseMove={handlePointerMove}
              onMouseUp={handlePointerUp}
              onMouseLeave={handlePointerUp}
              onTouchStart={handlePointerDown}
              onTouchMove={handlePointerMove}
              onTouchEnd={handlePointerUp}
              className={`w-full h-full block touch-none ${
                boardMode === 'overlay' && clickThrough ? 'pointer-events-none' : 'cursor-crosshair'
              }`}
            />
          </div>
        </div>
      );
    }

    // Student & Lesson Smart Notepad (Soru & Ders Not Defteri)
    function StudentNotepadModal({ isOpen, onClose, contextKey, contextLabel, activeKey: propActiveKey, activeTitle: propActiveTitle, customNotes = {}, onSaveNote }) {
      const resolvedKey = contextKey || propActiveKey || 'general';
      const resolvedLabel = contextLabel || propActiveTitle || 'Current Item';
      const [noteTab, setNoteTab] = React.useState('item'); // 'item' (Bu Soru/Ders) | 'general' (Genel Ders Notları)
      const activeKey = noteTab === 'item' ? resolvedKey : '__GENERAL_NOTEBOOK__';
      const currentText = (customNotes && customNotes[activeKey]) || '';

      if (!isOpen) return null;

      const handleInsertSnippet = (snippet) => {
        const nextText = currentText ? `${currentText}\n${snippet} ` : `${snippet} `;
        if (onSaveNote) onSaveNote(activeKey, nextText);
      };

      const handleDownloadNotes = () => {
        const entries = Object.entries(customNotes || {}).filter(([_, v]) => v && v.trim());
        const body = entries.length > 0
          ? entries.map(([k, v]) => `=== ${k === '__GENERAL_NOTEBOOK__' ? 'GENEL DERS NOTLARI' : k} ===\n${v}\n`).join('\n')
          : 'Henüz kaydedilmiş not bulunmuyor.';
        const blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `bluebook-sat-study-notes-${new Date().toISOString().slice(0, 10)}.txt`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      };

      return (
        <div className="fixed bottom-16 left-4 sm:left-auto sm:right-4 z-40 w-[92vw] sm:w-96 bg-white dark:bg-zinc-900 border-2 border-amber-500/70 dark:border-amber-500/80 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
          {/* Header */}
          <div className="bg-amber-500/15 dark:bg-amber-950/70 px-4 py-2.5 border-b border-amber-200 dark:border-amber-800/60 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <Icon name="StickyNote" className="w-4 h-4 text-amber-600 dark:text-amber-400" />
              <span className="text-xs font-extrabold text-slate-900 dark:text-amber-100">
                Ders & Soru Not Defteri (Notepad)
              </span>
            </div>
            <div className="flex items-center space-x-1.5">
              <button
                onClick={handleDownloadNotes}
                className="px-2 py-0.5 rounded bg-amber-500/20 hover:bg-amber-500/30 text-[10px] font-bold text-amber-800 dark:text-amber-200 transition"
                title="Tüm notları .txt olarak indir"
              >
                .txt İndir
              </button>
              <button
                onClick={onClose}
                className="p-1 hover:bg-amber-500/20 rounded-lg text-slate-500 dark:text-amber-200"
                title="Close Notepad"

    // Calculator Modal (Desmos + Canvas Scientific Fallback)
    function DesmosCalculatorModal({ isOpen, onClose }) {
      const containerRef = React.useRef(null);
      const canvasRef = React.useRef(null);
      const [desmosLoaded, setDesmosLoaded] = React.useState(false);
      const [calcExpr, setCalcExpr] = React.useState("");
      const [calcResult, setCalcResult] = React.useState("");
      const [plotFn, setPlotFn] = React.useState("x^2 - 4");

      // Initialize Desmos if available
      React.useEffect(() => {
        if (!isOpen) return;

        if (window.Desmos && containerRef.current) {
          try {
            containerRef.current.innerHTML = "";
            const calculator = window.Desmos.GraphingCalculator(containerRef.current, {
              keypad: true,
              expressions: true,
              settingsMenu: false,
              zoomButtons: true
            });
            calculator.setExpression({ id: 'graph1', latex: 'y=x^2-2' });
            setDesmosLoaded(true);
            return () => calculator.destroy();
          } catch (e) {
            console.warn("Desmos init error, using canvas fallback:", e);
            setDesmosLoaded(false);
          }
        } else {
          setDesmosLoaded(false);
        }
      }, [isOpen]);

      // Draw function on HTML5 canvas fallback
      React.useEffect(() => {
        if (desmosLoaded || !isOpen || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);

        // Gridlines & Axes
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;

        // Draw axes
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.moveTo(w / 2, 0);
        ctx.lineTo(w / 2, h);
        ctx.stroke();

        // Plot function y = f(x)
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 2.5;
        ctx.beginPath();

        const scaleX = 25; // 25px per unit
        const scaleY = 25;
        let isFirst = true;

        let compiledFn = null;
        try {
          // Safe evaluation of standard functions
          const safeExpr = plotFn
            .replace(/\^/g, '**')
            .replace(/sin/g, 'Math.sin')
            .replace(/cos/g, 'Math.cos')
            .replace(/tan/g, 'Math.tan')
            .replace(/sqrt/g, 'Math.sqrt')
            .replace(/log/g, 'Math.log10')
            .replace(/ln/g, 'Math.log')
            .replace(/pi/g, 'Math.PI')
            .replace(/e/g, 'Math.E');
          compiledFn = Function('x', `"use strict"; return (${safeExpr});`);
        } catch (e) {
          compiledFn = null;
        }

        for (let px = 0; px < w; px++) {
          const x = (px - w / 2) / scaleX;
          let y = 0;
          if (compiledFn) {
            try {
              const res = compiledFn(x);
              y = typeof res === 'number' && !isNaN(res) ? res : 0;
            } catch (err) {
              y = 0;
            }
          }

          const py = h / 2 - y * scaleY;
          if (py >= -100 && py <= h + 100) {
            if (isFirst) {
              ctx.moveTo(px, py);
              isFirst = false;
            } else {
              ctx.lineTo(px, py);
            }
          } else {
            isFirst = true;
          }
        }
        ctx.stroke();
      }, [desmosLoaded, isOpen, plotFn]);

      if (!isOpen) return null;

      const handleBtnClick = (val) => {
        if (val === 'AC') {
          setCalcExpr("");
          setCalcResult("");
        } else if (val === 'DEL') {
          setCalcExpr(prev => prev.slice(0, -1));
        } else if (val === '=') {
          try {
            const sanitized = calcExpr
              .replace(/\^/g, '**')
              .replace(/sin/g, 'Math.sin')
              .replace(/cos/g, 'Math.cos')
              .replace(/tan/g, 'Math.tan')
              .replace(/sqrt/g, 'Math.sqrt')
              .replace(/pi/g, 'Math.PI')
              .replace(/e/g, 'Math.E');
            const res = Function(`"use strict"; return (${sanitized})`)();
            setCalcResult(String(Math.round(res * 100000) / 100000));
          } catch (e) {
            setCalcResult("Error");
          }
        } else {
          setCalcExpr(prev => prev + val);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-3">
          <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl max-w-4xl w-full h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div className="flex items-center justify-between px-5 py-3 border-b border-slate-200 dark:border-zinc-800 bg-slate-100 dark:bg-zinc-950">
              <div className="flex items-center space-x-2">
                <Icon name="Calculator" className="w-5 h-5 text-indigo-600 dark:text-indigo-400" />
                <span className="font-bold text-slate-800 dark:text-zinc-100">
                  {desmosLoaded ? "Desmos Graphing Calculator" : "Built-in Scientific & Canvas Graphing Calculator"}
                </span>
              </div>
              <button onClick={onClose} className="p-1.5 hover:bg-slate-200 dark:hover:bg-zinc-800 rounded-lg text-slate-500">
                <Icon name="X" className="w-5 h-5" />
              </button>
            </div>

            <div className="flex-1 overflow-hidden relative">
              {/* Desmos Container */}
              <div ref={containerRef} className={`w-full h-full ${desmosLoaded ? 'block' : 'hidden'}`}></div>

              {/* Offline Canvas Grapher & Scientific Pad Fallback */}
              {!desmosLoaded && (
                <div className="w-full h-full flex flex-col md:flex-row">
                  {/* Left: Canvas Grapher */}
                  <div className="flex-1 bg-slate-900 flex flex-col items-center justify-center p-4">
                    <div className="w-full max-w-md mb-2 flex items-center space-x-2">
                      <span className="text-white text-sm font-mono">y =</span>
                      <input
                        type="text"
                        value={plotFn}
                        onChange={(e) => setPlotFn(e.target.value)}
                        placeholder="e.g. x^2 - 4"
                        className="flex-1 px-3 py-1.5 bg-zinc-800 border border-zinc-700 text-white rounded-lg font-mono text-sm"
                      />
                    </div>
                    <canvas ref={canvasRef} width={420} height={320} className="bg-zinc-950 rounded-xl border border-zinc-800 shadow" />
                  </div>

                  {/* Right: Scientific Keypad */}
                  <div className="w-full md:w-80 bg-slate-50 dark:bg-zinc-900 border-t md:border-t-0 md:border-l border-slate-200 dark:border-zinc-800 p-4 flex flex-col">
                    <div className="bg-white dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 p-3 rounded-xl mb-3 text-right">
                      <div className="text-xs text-slate-400 font-mono h-4 overflow-x-auto">{calcExpr || "0"}</div>
                      <div className="text-xl font-bold font-mono text-slate-900 dark:text-white truncate">{calcResult || "0"}</div>
                    </div>

                    <div className="grid grid-cols-4 gap-1.5 text-xs font-mono">
                      {['sin', 'cos', 'tan', 'sqrt', '(', ')', '^', '/', '7', '8', '9', '*', '4', '5', '6', '-', '1', '2', '3', '+', '0', '.', 'pi', '='].map(btn => (
                        <button
                          key={btn}
                          onClick={() => handleBtnClick(btn)}
                          className={`p-2.5 rounded-lg font-bold transition ${btn === '=' ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-slate-200 dark:bg-zinc-800 text-slate-800 dark:text-zinc-200 hover:bg-slate-300 dark:hover:bg-zinc-700'}`}
                        >
                          {btn}
                        </button>
                      ))}
                      <button onClick={() => handleBtnClick('AC')} className="col-span-2 p-2 rounded-lg bg-rose-500/20 text-rose-600 dark:text-rose-400 font-bold hover:bg-rose-500/30">
                        AC
                      </button>
                      <button onClick={() => handleBtnClick('DEL')} className="col-span-2 p-2 rounded-lg bg-amber-500/20 text-amber-600 dark:text-amber-400 font-bold hover:bg-amber-500/30">
                        DEL
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

                    className={`relative h-11 rounded-xl flex flex-col items-center justify-center font-bold text-sm transition active:scale-95 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none ${

            </div>

            <p className="text-sm text-slate-600 dark:text-zinc-400 mb-4 leading-relaxed">
